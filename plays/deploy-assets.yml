---
# Deploy assets to storehouse.cttb/ansible
#
# Packages role files into tarballs on storehouse and serves them via HTTP.
# Run this whenever source files change to refresh what target machines download.
#
# Uses rsync (synchronize module) to preserve symlinks on Linux — required for
# the WhiteSur icon theme's links/ directory, which contains relative symlinks
# that macOS cp/tar cannot follow.
#
# Usage:
#   # All assets
#   ansible-playbook plays/deploy-assets.yml -e 'vault_storehouse_admin_password=...' --become
#
#   # Specific asset group
#   ansible-playbook plays/deploy-assets.yml --tags themes
#   ansible-playbook plays/deploy-assets.yml --tags wallpapers
#   ansible-playbook plays/deploy-assets.yml --tags gtk
#   ansible-playbook plays/deploy-assets.yml --tags icons

- hosts: storehouse
  become: yes
  vars:
    assets_dir: /srv/storehouse/ansible
    staging_dir: /tmp/storehouse-staging

  tasks:

    # ── Staging dir ───────────────────────────────────────────────────────

    - name: create staging directory
      file:
        path: "{{ staging_dir }}"
        state: directory
        mode: '0755'
      tags: always

    # ── GTK theme (pre-built .tar.xz — copy directly) ────────────────────

    - name: upload WhiteSur-Light gtk theme
      copy:
        src: "{{ playbook_dir }}/../roles/desktop-distributed/files/WhiteSur-gtk-theme/release/WhiteSur-Light.tar.xz"
        dest: "{{ assets_dir }}/WhiteSur-Light.tar.xz"
        mode: '0644'
      tags: [themes, gtk]

    - name: upload WhiteSur-Dark gtk theme
      copy:
        src: "{{ playbook_dir }}/../roles/desktop-distributed/files/WhiteSur-gtk-theme/release/WhiteSur-Dark.tar.xz"
        dest: "{{ assets_dir }}/WhiteSur-Dark.tar.xz"
        mode: '0644'
      tags: [themes, gtk]

    # ── Icon theme (symlinks — rsync to Linux, tar on target) ─────────────

    - name: sync WhiteSur icon theme source to storehouse
      synchronize:
        src: "{{ playbook_dir }}/../roles/desktop-distributed/files/WhiteSur-icon-theme/"
        dest: "{{ staging_dir }}/whitesur-icon-src/"
        links: yes
        delete: yes
        rsync_opts:
          - "--exclude=.DS_Store"
      tags: [themes, icons]

    - name: package WhiteSur icon theme tarball
      command: tar czf {{ assets_dir }}/WhiteSur-icon-theme.tar.gz -C {{ staging_dir }} whitesur-icon-src
      tags: [themes, icons]

    # ── Wallpapers ────────────────────────────────────────────────────────

    - name: sync wallpaper images to storehouse
      synchronize:
        src: "{{ playbook_dir }}/../roles/desktop-distributed/files/wallpapers/"
        dest: "{{ staging_dir }}/cttb-wallpapers/"
        delete: yes
        rsync_opts:
          - "--exclude=.DS_Store"
          - "--exclude=._*"
      tags: wallpapers

    - name: package wallpapers tarball
      command: tar czf {{ assets_dir }}/cttb-wallpapers.tar.gz -C {{ staging_dir }} cttb-wallpapers
      tags: wallpapers

    # ── Cleanup and ownership ─────────────────────────────────────────────

    - name: clean staging directory
      file:
        path: "{{ staging_dir }}"
        state: absent
      tags: always

    - name: set storehouse ownership on all assets
      file:
        path: "{{ assets_dir }}"
        state: directory
        owner: storehouse
        group: storehouse
        recurse: yes
      tags: always
