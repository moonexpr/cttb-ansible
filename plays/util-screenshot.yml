---
# Remote screenshot utility
# Takes a screenshot of the target machine's display using scrot and fetches it.
#
# Works both at the lightdm greeter and inside a live user session: it runs
# scrot as root using the auth file the running X server was started with
# (parsed from the Xorg command line, falling back to lightdm's
# /var/run/lightdm/root/:0). No per-user .Xauthority guessing, no hardcoded
# uids, NFS homes irrelevant.
#
# Usage:
#   utils/pb util-screenshot --limit <hostname> --ask-become-pass
#   utils/pb util-screenshot --limit <hostname> --ask-become-pass -e output_dir=/tmp/screenshots
#
# Requires: scrot on the target (installed by the lubuntu desktop role) and
# sudo rights for the SSH user. Fails loudly on non-desktop hosts.

- hosts: all
  gather_facts: false

  vars:
    output_dir: "{{ playbook_dir }}/../logs/screenshots"
    timestamp: "{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}"
    remote_png: /tmp/ansible-screenshot.png

  tasks:
    - name: take screenshot on remote machine (as root, using the X server's own auth file)
      become: true
      shell: |
        set -eu
        command -v scrot >/dev/null 2>&1 \
          || { echo "scrot not installed -- not a desktop host?" >&2; exit 3; }
        xline=$(ps -eo args= | grep -E '^([^ ]*/)?(Xorg|X) ' | head -n1) || true
        [ -n "${xline:-}" ] \
          || { echo "no X server running on this host" >&2; exit 4; }
        display=":0"
        xauth=""
        prev=""
        for tok in $xline; do
          [ "$prev" = "-auth" ] && xauth="$tok"
          case "$tok" in :[0-9]|:[0-9][0-9]) display="$tok" ;; esac
          prev="$tok"
        done
        # No -auth on the command line: fall back to the lightdm root cookie
        # for whichever display we found. (Avoid apostrophes in this block --
        # Ansible splits shell args on quotes and an unpaired one breaks parsing.)
        [ -n "$xauth" ] || xauth="/var/run/lightdm/root/$display"
        DISPLAY="$display" XAUTHORITY="$xauth" scrot -o "{{ remote_png }}"
        chmod 644 "{{ remote_png }}"
      args:
        executable: /bin/sh
      changed_when: false

    - name: ensure local output directory exists
      local_action:
        module: file
        path: "{{ output_dir }}"
        state: directory
      run_once: true
      become: false

    - name: fetch screenshot
      fetch:
        src: "{{ remote_png }}"
        dest: "{{ output_dir }}/{{ inventory_hostname }}-{{ timestamp }}.png"
        flat: true

    - name: clean up remote screenshot
      become: true
      file:
        path: "{{ remote_png }}"
        state: absent
      changed_when: false

    - name: report screenshot location
      debug:
        msg: "Screenshot saved to {{ output_dir }}/{{ inventory_hostname }}-{{ timestamp }}.png"
