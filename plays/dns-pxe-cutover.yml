---
# 2026-05-12 cutover: promote pxe24 (10.11.13.27) to be the canonical pxe.cttb,
# decommission the pxetest.cttb domain.
#
# This play edits /etc/unbound/unbound.conf.d/cttb on both authoritative
# resolvers (ub-adult, ub-igdvs) via the srv-vm LXD host:
#   - removes every pxetest.cttb local-data / local-data-ptr line.
#   - replaces the pxe.cttb A record (10.11.1.23 → 10.11.13.27) and the
#     PTR for 10.11.13.27 (which used to be pxetest.cttb).
#   - leaves all other lines untouched.
#
# Idempotent: the awk pass below is deterministic; running it twice is a
# no-op. Each file is backed up to .pxe-cutover-bak before mutation and
# restored automatically if `unbound-checkconf` fails.
#
# Rollback: revert the change in this script's awk block (i.e. flip
# pxe.cttb back to 10.11.1.23, re-add the pxetest.cttb pair) and re-run.
# Or, on each resolver, `cp /etc/unbound/unbound.conf.d/cttb.pxe-cutover-bak
# /etc/unbound/unbound.conf.d/cttb && systemctl reload unbound` if the
# backup is still present.
#
# Why raw + lxc exec: srv-vm is Ubuntu 16.04 (Python 3.5), too old for
# modern ansible modules. The unbound resolvers themselves don't expose
# SSH; srv-vm is the LXD host that can `lxc exec` into both.

- name: pxe.cttb DNS cutover (10.11.1.23 → 10.11.13.27, drop pxetest.cttb)
  hosts: srv-vm
  gather_facts: false
  vars:
    unbound_containers:
      - ub-adult
      - ub-igdvs
    unbound_zone_file: /etc/unbound/unbound.conf.d/cttb
    pxe_a_old: "10.11.1.23"
    pxe_a_new: "10.11.13.27"

  tasks:
    - name: cut pxe.cttb over to {{ pxe_a_new }} and drop pxetest.cttb records
      ansible.builtin.raw: |
        lxc exec {{ item }} -- bash <<'OUTER'
        set -e
        ZF={{ unbound_zone_file }}
        TMP=$(mktemp)
        # 1. Drop every pxetest.cttb fragment (both A/PTR and any orphan
        #    tokens left from earlier shell-quoting accidents).
        # 2. Rewrite the pxe.cttb A record from {{ pxe_a_old }} to {{ pxe_a_new }}.
        # 3. Rewrite the PTR for {{ pxe_a_new }} (was pxetest.cttb) to pxe.cttb.
        # 4. Drop any leftover PTR for {{ pxe_a_old }} so the old IP no longer
        #    reverse-resolves to pxe.cttb.
        sed -E \
          -e '/pxetest/d' \
          -e '/^(IN|A|10\.11\.13\.27)$/d' \
          -e '/^local-data-ptr: [0-9.]+$/d' \
          -e 's|"pxe\.cttb\. +IN +A +{{ pxe_a_old }}"|"pxe.cttb. IN A {{ pxe_a_new }}"|g' \
          -e '/local-data-ptr: "{{ pxe_a_old }} +pxe\.cttb\."/d' \
          "$ZF" > "$TMP"

        # Belt-and-suspenders: if the pxe.cttb A record wasn't already in the
        # file (e.g. the resolver had only the pxetest entry), append it.
        grep -q 'local-data: "pxe\.cttb\.' "$TMP" \
          || printf '\nlocal-data: "pxe.cttb. IN A {{ pxe_a_new }}"\n' >> "$TMP"

        # Likewise for the new PTR.
        grep -q 'local-data-ptr: "{{ pxe_a_new }} +pxe\.cttb\."' "$TMP" \
          || printf 'local-data-ptr: "{{ pxe_a_new }} pxe.cttb."\n' >> "$TMP"

        if cmp -s "$ZF" "$TMP"; then
          echo ALREADY_CLEAN
          rm -f "$TMP"
        else
          cp "$ZF" "$ZF.pxe-cutover-bak"
          mv "$TMP" "$ZF"
          if unbound-checkconf > /tmp/unbound-check.log 2>&1; then
            systemctl reload unbound 2>&1 || systemctl restart unbound
            echo UPDATED
          else
            mv "$ZF.pxe-cutover-bak" "$ZF"
            cat /tmp/unbound-check.log
            echo CHECKCONF_FAILED
            exit 1
          fi
        fi
        systemctl is-active unbound
        OUTER
      register: dns_cut
      changed_when: "'UPDATED' in dns_cut.stdout"
      loop: "{{ unbound_containers }}"

    - name: report
      ansible.builtin.debug:
        msg: "{{ item.item }}: {{ 'UPDATED' if (item.stdout | default('') is search('UPDATED')) else 'ALREADY_CLEAN' }}"
      loop: "{{ dns_cut.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: dns_cut is defined and dns_cut.results is defined
