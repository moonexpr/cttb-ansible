---
# Deploy Ubuntu 24.04 LTS network installation infrastructure to pxe.cttb.
#
# pxe.cttb is the pxe24 LXC container on srv-nas (10.11.1.23 since the
# 2026-05-12 re-IP cutover, which took the infrastructure-subnet IP the
# legacy Ubuntu 16.04 box used to own). Ubuntu 24.04 + nginx + h5ai.
# The legacy 16.04 box at 10.11.13.27 was decommissioned in that cutover;
# if you need the apache2 code path back, override `ni_webserver: apache2`
# on the command line.
#
# Re-IP discipline: after any future re-IP of this container, re-apply this
# play against cttb_pxe so the `etc-default-tftpd-hpa.j2` template picks
# up the new `ansible_default_ipv4.address`. The dnsmasq `dhcp-boot=` lines
# on dnsmasq.cttb are NOT templated by this play (see gh-60 follow-up) —
# update them in /etc/dnsmasq.conf by hand at cutover time until they are.
#
# Usage (from a campus workstation — no jumphost needed):
#   ansible-playbook plays/netinstall-2404.yml -i inventory/sudhanix26_hosts.ini --diff
#
# After running this playbook, PXE-boot any lab machine and select
# the desired Ubuntu 24.04 installation profile from the boot menu.
#
# This play installs nginx + tftpd-hpa + h5ai and lays the directory tree.
# To push fresh PXE/grub menu config + autoinstall user-data + ISO extraction,
# follow up with `plays/deploy-netinstall-2404.yml` (which renders templates
# locally and rsyncs them up).

- hosts: cttb_pxe
  become: true
  vars:
    ni_webserver: nginx
    ni_h5ai_enabled: true
    ni_php_version: "8.1"
    ni_server_name: "pxe.cttb"
    ansible_assets_url: "http://storehouse.cttb/ansible"
  roles:
    - netinstall-2404
