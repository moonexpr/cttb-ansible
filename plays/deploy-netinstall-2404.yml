---
# Deploy Ubuntu 24.04 autoinstall infrastructure to the PXE server.
#
# Uses raw module throughout because the PXE server (Ubuntu 16.04) has
# Python 3.5 which is incompatible with Ansible 2.20+ modules.
#
# Usage:
#   ansible-playbook plays/deploy-netinstall-2404.yml \
#     -i inventory/sudhanix26_hosts.ini --vault-password-file <vault-pass>
#
# To enable auto-install on PXE boot (for upgrade rollouts):
#   ansible-playbook plays/deploy-netinstall-2404.yml \
#     -i inventory/sudhanix26_hosts.ini --vault-password-file <vault-pass> \
#     -e ni_pxe_default=Autoinstall-noble-desktop
#
# To restore safe local-boot default after rollout:
#   ansible-playbook plays/deploy-netinstall-2404.yml \
#     -i inventory/sudhanix26_hosts.ini --vault-password-file <vault-pass> \
#     -e ni_pxe_default=BootLocal -t ni_pxe_menu

- name: Render netinstall-2404 templates locally
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: netinstall-2404
      delegate_to: skip
  vars:
    ni_staging_dir: "{{ lookup('env', 'TMPDIR') | default('/tmp') }}/netinstall-2404-stage"
  tasks:
    - name: create local staging directory tree
      file:
        path: "{{ ni_staging_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - autoinstall/ubuntu/desktop-minimal
        - autoinstall/ubuntu/server
        - menu
        - pxelinux.cfg
        - grub
      tags: always

    - name: render autoinstall user-data files
      template:
        src: "{{ playbook_dir }}/../roles/netinstall-2404/templates/autoinstall/user-data-{{ item }}.j2"
        dest: "{{ ni_staging_dir }}/autoinstall/ubuntu/{{ item }}/user-data"
        mode: "0644"
      loop:
        - desktop-minimal
        - server
      tags: ni_autoinstall

    - name: render autoinstall meta-data files
      template:
        src: "{{ playbook_dir }}/../roles/netinstall-2404/templates/autoinstall/meta-data.j2"
        dest: "{{ ni_staging_dir }}/autoinstall/ubuntu/{{ item }}/meta-data"
        mode: "0644"
      loop:
        - desktop-minimal
        - server
      tags: ni_autoinstall

    - name: render pxe install menu
      template:
        src: "roles/netinstall-2404/templates/pxe/pxe-install-menu-2404.j2"
        dest: "{{ ni_staging_dir }}/menu/ubuntu-live-server-amd64-noble.menu"
        mode: "0644"
      vars:
        item: "{{ ni_2404_images[0] }}"
      tags: ni_pxe_menu

    - name: render pxelinux default config
      template:
        src: "roles/netinstall-2404/templates/pxe/pxelinux-cfg-default-2404.j2"
        dest: "{{ ni_staging_dir }}/pxelinux.cfg/default"
        mode: "0644"
      tags: ni_pxe_menu

    - name: render grub.cfg for UEFI EFI PXE boot
      template:
        src: "{{ playbook_dir }}/../roles/netinstall-2404/templates/pxe/grub-cfg-2404.j2"
        dest: "{{ ni_staging_dir }}/grub/grub.cfg"
        mode: "0644"
      tags:
        - ni_pxe_menu
        - ni_grub

    - name: copy postinst script to staging
      copy:
        src: "{{ playbook_dir }}/../roles/netinstall-2404/files/autoinstall-postinst.sh"
        dest: "{{ ni_staging_dir }}/autoinstall/postinst.sh"
        mode: "0755"
      tags: ni_autoinstall

- name: Deploy netinstall-2404 to PXE server
  hosts: pxe-server
  gather_facts: false
  become: true
  vars:
    ni_staging_dir: "{{ lookup('env', 'TMPDIR') | default('/tmp') }}/netinstall-2404-stage"
    ni_root_dir: /srv/netinstall
    ni_www_path: /var/www/html/netinstall
    ni_iso_url: "http://storehouse.cttb/ansible/isos/ubuntu-24.04.2-live-server-amd64.iso"
    ni_iso_local: "/srv/storehouse/ansible/isos/ubuntu-24.04.2-live-server-amd64.iso"
  tasks:
    # --- Package installation ---
    - name: install required packages
      raw: apt-get install -y tftpd-hpa apache2 p7zip-full pxelinux
      tags: ni_packages

    # --- Sync files via rsync (no Python needed) ---
    - name: sync autoinstall configs to PXE server
      synchronize:
        src: "{{ ni_staging_dir }}/autoinstall/"
        dest: "{{ ni_root_dir }}/autoinstall/"
        delete: false
        rsync_opts:
          - "--chmod=D755,F644"
      tags: ni_autoinstall

    - name: sync PXE menu to server
      synchronize:
        src: "{{ ni_staging_dir }}/menu/"
        dest: "{{ ni_root_dir }}/menu/"
        delete: false
        rsync_opts:
          - "--chmod=D755,F644"
      tags: ni_pxe_menu

    - name: sync pxelinux config to server
      synchronize:
        src: "{{ ni_staging_dir }}/pxelinux.cfg/"
        dest: "{{ ni_root_dir }}/pxelinux.cfg/"
        delete: false
        rsync_opts:
          - "--chmod=D755,F644"
          - "--backup"
          - "--suffix=.bak"
      tags: ni_pxe_menu

    - name: sync grub.cfg to server (UEFI EFI boot)
      synchronize:
        src: "{{ ni_staging_dir }}/grub/"
        dest: "{{ ni_root_dir }}/grub/"
        delete: false
        rsync_opts:
          - "--chmod=D755,F644"
          - "--backup"
          - "--suffix=.bak"
      tags:
        - ni_pxe_menu
        - ni_grub

    - name: fix postinst script permissions
      raw: chmod 755 {{ ni_root_dir }}/autoinstall/postinst.sh
      tags: ni_autoinstall

    # --- ISO and kernel extraction ---
    - name: copy ISO to netinstall cache (if not present)
      raw: |
        if [ ! -f {{ ni_root_dir }}/ubuntu-live-server-noble-amd64.iso ]; then
          cp {{ ni_iso_local }} {{ ni_root_dir }}/ubuntu-live-server-noble-amd64.iso
          echo COPIED
        else
          echo EXISTS
        fi
      register: iso_copy
      changed_when: "'COPIED' in iso_copy.stdout"
      tags: ni_isos

    - name: extract kernel and initrd from ISO (if not present)
      raw: |
        if [ ! -d {{ ni_root_dir }}/ubuntu/live-server-noble-amd64/casper ]; then
          7z x -o{{ ni_root_dir }}/ubuntu/live-server-noble-amd64 \
            {{ ni_root_dir }}/ubuntu-live-server-noble-amd64.iso \
            casper/vmlinuz casper/initrd 2>&1
          chmod -R 755 {{ ni_root_dir }}/ubuntu/live-server-noble-amd64
          echo EXTRACTED
        else
          echo EXISTS
        fi
      register: kernel_extract
      changed_when: "'EXTRACTED' in kernel_extract.stdout"
      tags: ni_isos

    - name: symlink ISO for HTTP serving
      raw: >
        ln -sf {{ ni_root_dir }}/ubuntu-live-server-noble-amd64.iso
        {{ ni_root_dir }}/ubuntu/live-server-noble-amd64.iso
      tags: ni_isos

    - name: ensure www symlink exists
      raw: |
        if [ ! -L {{ ni_www_path }} ]; then
          ln -sf {{ ni_root_dir }} {{ ni_www_path }}
          echo CREATED
        else
          echo EXISTS
        fi
      register: www_link
      changed_when: "'CREATED' in www_link.stdout"

    # --- Service restart ---
    - name: restart tftpd-hpa
      raw: systemctl restart tftpd-hpa
      tags: ni_pxe_menu

    # --- Cleanup ---
    - name: remove local staging directory
      file:
        path: "{{ ni_staging_dir }}"
        state: absent
      delegate_to: localhost
      become: false
      tags: always
