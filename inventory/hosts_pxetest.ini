; Inventory for the parallel test PXE server.
; The production PXE server lives in inventory/sudhanix26_hosts.ini under [pxe-server].
; Keep this file separate so any play that targets [pxe-server] can never
; accidentally hit prod (10.11.1.23) when run with -i inventory/hosts_pxetest.ini.

[pxetest-server]
pxetest ansible_host=10.11.13.27 ansible_user=root ansible_become=false ansible_ssh_common_args='-o ProxyJump=rui-desktop2 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

; Alias so plays/deploy-netinstall-2404.yml (hosts: pxe-server) can be re-used
; against pxetest with -i inventory/hosts_pxetest.ini. Only valid in this file —
; prod's pxe-server is in inventory/sudhanix26_hosts.ini.
[pxe-server:children]
pxetest-server
