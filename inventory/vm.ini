# gh-22: throwaway-VM inventory stub for local Sudhanix role testing.
#
# Populated by tests/vm-pipeline.sh after `multipass launch`. The VM is
# put in the dvgs_cs_lab group so plays/sudhanix26-rollout-stage2.yml
# (hosts: dvgs_cs_lab:dvbs_cs_lab:drbu_cs_lab) applies the same roles a
# real lab desktop gets. Connection vars are filled in by the script
# (ansible_host = multipass IP, ansible_user = ubuntu).
#
# Never reaches production: pass this file explicitly, e.g.
#   ansible-playbook plays/sudhanix26-rollout-stage2.yml -i inventory/vm.ini -l sudhanix-vm
[dvgs_cs_lab]
sudhanix-vm ansible_host=PLACEHOLDER_IP ansible_user=ubuntu ansible_python_interpreter=/usr/bin/python3
