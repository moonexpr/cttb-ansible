# gh-69: dedicated stub inventory for the dnsmasq host.
#
# Kept OUT of inventory/sudhanix26_hosts.ini on purpose: that file's
# `hosts: all` plays (e.g. sudhanix26-rollout.yml) must not start
# reaching dnsmasq.cttb. Pass this file alongside the main inventory
# only for plays/dnsmasq-pxe.yml.
#
# dnsmasq.cttb is an LXC on srv-vm. The operator confirms/edits the
# connection (address + user) on first run — these are the documented
# coordinates from gh-69 (LXC on srv-vm, 10.11.1.19); adjust if the
# container is reachable under a different alias/jump.
[dnsmasq_servers]
dnsmasq.cttb ansible_host=10.11.1.19 ansible_user=root
