# Off-campus Sudhanix 26 hosts.
#
# These machines live OUTSIDE the CTTB network: no DNS for *.cttb, no route to
# 10.11.0.0/16, public internet only. group_vars/offsite rebinds every
# campus-internal URL; plays/sudhanix26-rollout-stage2-offsite.yml selects the
# roles that can work without campus services.
#
# Deliberately NOT merged into inventory/sudhanix26_hosts.ini. That file is a
# PXE/WoL target list keyed on mac_addr and 10.11.x ansible_address, neither of
# which an offsite host has -- and plays/sudhanix26-rollout-stage2.yml is
# `hosts: all`, so one forgotten -l would sweep an offsite machine into a campus
# run and rewrite its apt sources to a mirror it cannot reach. Separate files
# make that class of mistake impossible rather than merely discouraged.
#
# group_vars are shared regardless: inventory/group_vars is a symlink to
# ../group_vars, so group_vars/offsite applies from any inventory source.
#
# Usage:
#   utils/offsite-relay run sc-cslab-pc-right
#
# Hostnames here carry NO .cttb suffix -- roles/common sets the machine's
# hostname from inventory_hostname, and these hosts are not in campus DNS.

[offsite]
sc-cslab-pc-right ansible_host=192.168.1.244
