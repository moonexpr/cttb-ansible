[pxe-server]
; pxe is now the pxe24 LXC container on srv-nas (Ubuntu 24.04 + nginx + h5ai).
; The container is re-IP'd to 10.11.1.23 — the infrastructure-subnet IP that the
; legacy Ubuntu 16.04 box (decommissioned in the 2026-05-12 cutover) used to own,
; so every downstream client (DNS, dhcp-boot on dnsmasq, hardcoded lab refs)
; reaches the new server without any redirection. ansible_host stays unset — DNS
; resolves pxe to 10.11.1.23 the same way every other host on campus does.
; Production runs happen from the campus network, so no ProxyJump in this file.
pxe ansible_user=root ansible_become=false

