---

  - name: install autofs and nfs
    apt:
      state: present
      name:
      - autofs
      - nfs-common
    tags:
      - autofs

  # do not configure it if no nfs homes/export vars are provided
  - block:
    - name: copy autofs.conf
      copy:
        src: autofs.conf
        dest: /etc/autofs.conf
        owner: root
        group: root
        mode: 0640
        force: yes
      notify:
        - restart autofs
      ignore_errors: yes
      # Upstart is not started yet so can not restart autofs in post-installation of a new machine, so ignore errors...

    - name: copy auto.master
      copy:
        src: auto.master
        dest: /etc/auto.master
        owner: root
        group: root
        mode: 0640
        force: yes
      notify:
        - restart autofs
      ignore_errors: yes

    - name: setup auto.nfs
      template:
        src: auto.nfs.j2
        dest: /etc/auto.nfs
        owner: root
        group: root
        mode: 0640
      notify:
        - restart autofs
      ignore_errors: yes
    when: nfs_homes_host is defined and nfs_homes_export is defined
    tags:
      - autofs

  - name: install unburden homedir
    apt:
      name: unburden-home-dir
      state: present
    tags:
      - unburden

  - name: deploy /etc/unburden-home-dir
    copy:
      src: unburden-home-dir
      dest: /etc/unburden-home-dir
      owner: root
      group: root
      mode: 0644
    tags:
      - unburden

  - name: deploy /etc/unburden-home-dir.list
    copy:
      src: unburden-home-dir.list
      dest: /etc/unburden-home-dir.list
      owner: root
      group: root
      mode: 0644
    tags:
      - unburden

  - name: deploy /etc/default/unburden-home-dir
    copy:
      src: unburden-default
      dest: /etc/default/unburden-home-dir
      owner: root
      group: root
      mode: 0644
    tags:
      - unburden
