---

# h5ai version — manti-X fork (https://github.com/manti-X/h5ai)
storehouse_h5ai_version: "0.33.0"

# Filesystem paths
storehouse_root: "/srv/storehouse"
storehouse_subdirs:
  - ansible/isos

# System user
storehouse_user: "storehouse"
storehouse_group: "storehouse"

# PHP version (Ubuntu 22.04 ships 8.1)
storehouse_php_version: "8.1"

# Network
storehouse_port: 80
storehouse_server_name: "storehouse.cttb"
