---

- name: install NUT packages
  package:
    name: nut
    state: present

- name: Install NUT config files.
  template:
    src: "{{ item }}.j2"
    dest: "/etc/nut/{{ item }}"
    owner: root
    group: nut
    mode: 0640
  with_items:
    - nut.conf
    - ups.conf
    - upsd.conf
    - upsd.users
    - upsmon.conf
  notify: restart nut

- name: Install NUT systemd shutdown script
  copy:
    src: nutshutdown
    dest: /lib/systemd/system-shutdown/nutshutdown
    owner: root
    group: nut
    mode: 0750
