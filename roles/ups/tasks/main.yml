---

- name: install NUT packages
  package:
    name: nut
    state: present

- name: configure NUT (standalone or server mode)
  template:
    src: "{{ item }}.j2"
    dest: "/etc/nut/{{ item }}"
    owner: root
    group: nut
    mode: 0640
  with_items:
    - nut.conf
    - ups.conf
    - upsd.conf
    - upsd.users
    - upsmon.conf
  when: nut_mode == "netserver" or nut_mode == "standalone"
  notify:
    - restart nut-server
    - restart nut-client

- name: configure NUT (client mode)
  template:
    src: "{{ item }}.j2"
    dest: "/etc/nut/{{ item }}"
    owner: root
    group: nut
    mode: 0640
  with_items:
    - nut.conf
    - upsd.users
    - upsmon.conf
  when: nut_mode == "netclient"
  notify: restart nut-client

- name: Install NUT systemd shutdown script
  copy:
    src: nutshutdown
    dest: /lib/systemd/system-shutdown/nutshutdown
    owner: root
    group: nut
    mode: 0750
