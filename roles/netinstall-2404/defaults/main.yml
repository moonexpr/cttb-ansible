---

ni_root_dir: /srv/netinstall
ni_tftp_dir: "{{ni_root_dir}}"
ni_autoinstall_dir: "{{ni_root_dir}}/autoinstall"
ni_pxe_menu_dir: "{{ni_root_dir}}/menu"
ni_isos_cache_dir: "{{ni_root_dir}}"
ni_isos_baseurl: "{{ansible_assets_url}}/isos"
ni_www_path: "/var/www/html/netinstall"

# Webserver to serve kernels, initrd, ISOs, and autoinstall configs over HTTP.
# Supported values: 'nginx' (current default — pxe.cttb is pxe24 on srv-nas, Ubuntu 24.04),
# 'apache2' (retained for archaeological reasons; the legacy Ubuntu 16.04 pxe.cttb box at
# 10.11.1.23 was decommissioned in the 2026-05-12 cutover).
ni_webserver: nginx

# nginx server_name for the netinstall site. Mirrors storehouse_server_name.
ni_server_name: "pxe.cttb"

# h5ai (manti-X fork) enables a pretty browseable index for /netinstall/.
# Only meaningful when ni_webserver == 'nginx'. Modeled on the storehouse role.
ni_h5ai_enabled: true
ni_h5ai_version: "0.33.0"

# PHP-FPM version. Ubuntu 22.04 ships 8.1; Debian 13 ships 8.2.
ni_php_version: "8.1"

# Ubuntu 24.04.2 LTS (Noble Numbat) live server ISO
# The live server ISO is used for headless autoinstall deployments.
# No mini.iso exists for 24.04; autoinstall replaces preseed.
ni_2404_images:
  - name: noble
    os: ubuntu
    type: live-server
    arch: amd64
    url: "{{ni_isos_baseurl}}/ubuntu-24.04.2-live-server-amd64.iso"
    # casper paths inside the live server ISO
    kernel_path: casper/vmlinuz
    initrd_path: casper/initrd
    autoinstall:
      - name: desktop-minimal
        description: "Sudhanix 26 Desktop"
      - name: server
        description: "Ubuntu 24.04 Server"

# Default administrator user for autoinstall
ni_admin_user: administrator
ni_admin_fullname: Administrator
ni_admin_uid: "999"
# Same crypted password as the existing preseed deployment
ni_admin_password_crypted: "$1$YGmPEYhr$WDaYWLKV.dixml0kcrUr91"

# SSH public keys for post-install access
ni_ansible_ssh_pubkey: "ssh-rsa  ansible@cttb.us"
ni_jc_ssh_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAII9h7P61o83zmawtbNML2bFA53k6l17uuW+9SraMPx/5 jc@cosmicbook.local"

# Timezone and locale defaults
ni_timezone: US/Pacific
ni_locale: en_US.UTF-8
ni_keyboard_layout: us

# Wifi configuration for autoinstall.
# CS-lab desktops are wired — leave SSID empty so no wifi block is emitted.
# The Subiquity live env uses networkd as its netplan renderer, which does NOT
# support wifi by match: pattern (only NetworkManager does). If you enable wifi
# here, `netplan apply` in the live env will fail with:
#   "id1: networkd backend does not support wifi with match:, only by interface name"
# Override per-host (laptops/tablets) with: -e ni_wifi_ssid=DRBU
ni_wifi_ssid: ""
ni_wifi_password: ""

# PXE menu behavior
# Set ni_pxe_default to a LABEL name to auto-select on timeout.
# Use "BootLocal" for normal operation, "Autoinstall-noble-desktop" for upgrade rollouts.
ni_pxe_default: "BootLocal"
ni_pxe_timeout: 100

# GRUB EFI PXE timeout in seconds (GRUB uses seconds, unlike pxelinux's 1/10s units)
ni_grub_timeout: 10
