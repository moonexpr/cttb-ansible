---
# Software orchestrator for sudhanix-core.
#
# Two-block phase shape (issue #57, Task 5): sw.yml's own work is all
# install-shape (apt installs / removes / .deb fetches for Zoom + Skype).
# It also dispatches to four sub-files. sub-files carry their own phase
# gates; they're included at top level so both install and configure
# phases pull them in, and each sub-file's `when:` decides whether its
# install block, configure block, or both fire under the propagated
# __sudhanix_phase.

  - name: sw — install phase
    when: __sudhanix_phase | default("all") in ["install", "all"]
    tags:
      - install
      - sw_install
    block:

      - name: install additional software
        apt:
          state: present
          install_recommends: yes
          name:
          - audacious
          - audacity
          - blender
          - cups-client
          - gimp
          - imagemagick-6.q16hdri
          - inkscape
          - kdenlive
          - pavucontrol-qt
          - python-is-python3
          - python3-pip
          - ubuntu-restricted-addons
          - ubuntu-restricted-extras
          - vlc
        tags:
          - packages

      - name: install desktop sw requested for this box
        apt:
          name: "{{additional_desktop_sw | default([])}}"
          state: present
        tags:
          - packages
          - additional_desktop_sw

      # removing bunch of sw I don't need
      - name: remove other apps
        apt:
          state: absent
          purge: yes
          name:
          - cups-browsed
          - deja-dup
          - eog
          - galculator
          - gdb
          - gnome-keyring
          - gnome-logs
          - midori      # a lightweight web browser in Ubuntu 20.04 minimal ISO.
          - nautilus
          - sylpheed*
          - update-manager
          - update-notifier
          - update-notifier-common     # Will be installed by "ubuntu-restricted-extras".
        tags:
          - packages

      # Purging failed at preseed time since it's removing a file /.../whoopsie-id that'll be created until the 1st run.
      - name: purge whoopsie
        apt:
          state: absent
          purge: yes
          name:
          - whoopsie
        ignore_errors: true
        tags:
          - packages

      # Seems no need to have snap store. ignore_errors matches the other
      # snap removals: on a fresh PXE image without snapd, the snap module
      # fails outright instead of reporting "not installed".
      - name: remove snap-store
        snap:
          name: snap-store
          state: absent
        ignore_errors: true
        tags:
          - packages

      # zoom_deb_url is set in group_vars/all and points at the storehouse
      # copy; the zoom.us default only fires if that override is removed.
      # The storehouse .deb currently has a broken archive signature
      # (deploys pass --skip-tags zoom) — the rescue makes a run that
      # forgets the skip survivable instead of fatal.
      - name: install Zoom client
        block:
          - name: upgrade Zoom client
            apt:
              deb: "{{ zoom_deb_url | default('https://zoom.us/client/latest/zoom_amd64.deb') }}"
              only_upgrade: true
            register: zoom_upgraded

          - name: install Zoom client for the 1st time
            apt:
              deb: "{{ zoom_deb_url | default('https://zoom.us/client/latest/zoom_amd64.deb') }}"
            when: zoom_upgraded is not changed
        rescue:
          - name: surface Zoom install failure (Zoom skipped this run)
            debug:
              msg: >-
                Zoom setup failed on {{ inventory_hostname }}
                (task '{{ ansible_failed_task.name | default("unknown") }}':
                {{ ansible_failed_result.msg | default("no message") }}).
                Zoom was NOT installed; the play continues.
        tags:
          - zoom

      - name: install Skype client
        block:
          - name: upgrade Skype
            apt:
              deb: "{{ansible_assets_url}}/skypeforlinux-64.deb"
              only_upgrade: true
            register: skype_upgraded

          - name: install Skype for the 1st time
            apt:
              deb: "{{ansible_assets_url}}/skypeforlinux-64.deb"
            when: skype_upgraded is not changed
        rescue:
          - name: surface Skype install failure (Skype skipped this run)
            debug:
              msg: >-
                Skype setup failed on {{ inventory_hostname }}
                (task '{{ ansible_failed_task.name | default("unknown") }}':
                {{ ansible_failed_result.msg | default("no message") }}).
                Skype was NOT installed; the play continues.
        when: skype == true
        tags:
          - skype

  # Sub-includes at top level — __sudhanix_phase propagates from the
  # parent scope, each sub-file's own block-level `when:` gate decides
  # whether its install / configure body fires for the current phase.
  - include_tasks: sw-office.yml
    tags:
      - office

  - include_tasks: sw-browser.yml
    tags:
      - browser

  - include_tasks: sw-thunderbird.yml
    when: thunderbird == true
    tags:
      - thunderbird

  - include_tasks: sw-vscode.yml
    tags:
      - vscode
