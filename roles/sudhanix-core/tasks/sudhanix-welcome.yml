---
# First-login welcome window.
#
# Components:
#   * /usr/local/bin/sudhanix-welcome       — GTK3 welcome app
#   * /usr/share/sudhanix/welcome/          — wordmark, customize.yml
#   * /usr/share/sudhanix/welcome-icons/    — theme-neutral stack-page SVGs
#   * /etc/xdg/autostart/sudhanix-welcome.desktop — XDG autostart on graphical session
#
# 2026-05-20: Dismissal state moved off LDAP onto a stamp file at
#   ~/.config/sudhanix/welcome-dismissed
# carried across machines by the NFS automount of home directories.
# The PAM token cache helpers, tmpfiles.d entry, and PAM include lines
# below are commented out; the LDAP schema/ACL role
# (roles/ldap-schema-sudhanix, plays/ldap-install-sudhanix26-scheme.yml)
# is likewise dormant. Uncomment to revert.

# The welcome app is pure-Python + GTK3. python3-gi and gir1.2-gtk-3.0
# are transitive dependencies of the lubuntu desktop, so no explicit
# `apt: name=...` is needed here.

