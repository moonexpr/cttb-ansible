- name: deploy welcome app
  copy:
    src: welcome/sudhanix-welcome
    dest: /usr/local/bin/sudhanix-welcome
    owner: root
    group: root
    mode: '0755'
  tags:
    - sudhanix_welcome

- name: ensure welcome data dir exists
  file:
    path: /usr/share/sudhanix/welcome
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags:
    - sudhanix_welcome

- name: deploy wordmark branding image
  copy:
    src: branding/sx26/wordmark.png
    dest: /usr/share/sudhanix/welcome/wordmark.png
    owner: root
    group: root
    mode: '0644'
  tags:
    - sudhanix_welcome

- name: deploy customize.yml (theme / browser / dock-category presets)
  copy:
    src: welcome/customize.yml
    dest: /usr/share/sudhanix/welcome/customize.yml
    owner: root
    group: root
    mode: '0644'
  tags:
    - sudhanix_welcome

- name: ensure welcome icons dir exists
  file:
    path: /usr/share/sudhanix/welcome-icons
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags:
    - sudhanix_welcome

- name: deploy theme-neutral welcome icons (SVG line-art for stack-page cards)
  copy:
    src: "{{ item }}"
    dest: "/usr/share/sudhanix/welcome-icons/{{ item | basename }}"
    owner: root
    group: root
    mode: '0644'
  with_fileglob:
    - "welcome/icons/*.svg"
  tags:
    - sudhanix_welcome

- name: deploy XDG autostart entry
  copy:
    src: welcome/sudhanix-welcome.desktop
    dest: /etc/xdg/autostart/sudhanix-welcome.desktop
    owner: root
    group: root
    mode: '0644'
  tags:
    - sudhanix_welcome

