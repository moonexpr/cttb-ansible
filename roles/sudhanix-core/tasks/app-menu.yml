---
# Customize the applications menu in lxqt-panel

  - name: ensure light-locker-settings desktop file ends with newline
    shell: |
      FILE=/usr/share/applications/light-locker-settings.desktop
      [ -f "$FILE" ] && [ -n "$(tail -c1 "$FILE")" ] && echo >> "$FILE" || true
    args:
      executable: /bin/bash
    changed_when: false
    tags:
      - app_menu

  # First, update the lxqt-applications.menu file itself;
  # Then, update the individual .desktop files.
  # Note: Lubuntu 24.04 uses lxde-applications.menu, not lxqt-applications.menu.

  - name: find lxqt applications menu file
    stat:
      path: /etc/xdg/menus/lxqt-applications.menu
    register: lxqt_menu_file

  - name: hide 'Lock Screen' from top menu
    lineinfile:
      path: /etc/xdg/menus/lxqt-applications.menu
      regexp: '^\s+<Menuname(.*)>Screensaver</Menuname>'
      line: '                        <!-- <Menuname\1>Screensaver</Menuname> -->'
      backrefs: yes
    when: lxqt_menu_file.stat.exists
    tags:
      - app_menu

  - name: comment out the Screensaver category in the top menu
    replace:
      path: /etc/xdg/menus/lxqt-applications.menu
      regexp: '^\s+<!-- Screensaver -->[^"]*<!-- End Screensaver -->\s+$'
      replace: ''
    when: lxqt_menu_file.stat.exists
    tags:
      - app_menu

  - name: move 'Lock Screen' into Leave
    lineinfile:
      path: /usr/share/applications/lxqt-lockscreen.desktop
      regexp: '^Categories='
      line: Categories=System;X-Leave
    tags:
      - app_menu

  # Pre-filter to only files that exist on this install profile.
  # lubuntu-core (minimal) lacks software-properties-{gtk,drivers},
  # gnome-language-selector, etc.; lineinfile rc=257s on absent dest.
  - name: find existing apps to hide in the app menu
    find:
      paths: /usr/share/applications
      patterns:
        - fcitx.desktop
        # No need to show a generic Leave
        - lxqt-leave.desktop
        # Hibernate does not work
        - lxqt-hibernate.desktop
        # TeXInfo
        - info.desktop
        - vim.desktop
        # Additional Device Drivers
        - software-properties-drivers.desktop
        - nm-connection-editor.desktop
        - org.freedesktop.IBus.Setup.desktop
        - im-config.desktop
        - time.desktop
        - software-properties-gtk.desktop
        - users.desktop
        - obconf.desktop
        - fcitx-configtool.desktop
        - lightdm-gtk-greeter-settings.desktop
        - light-locker-settings.desktop
        - gnome-language-selector.desktop
        - xfce4-power-manager-settings.desktop
        - lxinput.desktop
        - lxqt-config-monitor.desktop
    register: apps_to_hide_found
    tags:
      - app_menu

  - name: hide apps in the app menu
    lineinfile:
      dest: "{{ item.path }}"
      line: "NoDisplay=true"
    loop: "{{ apps_to_hide_found.files }}"
    loop_control:
      label: "{{ item.path | basename }}"
    tags:
      - app_menu
