---

- name: Set platform/version specific variables
  ansible.builtin.include_vars: "{{ __desktop_vars_file }}"
  loop:
    - "{{ ansible_facts['distribution'] }}_{{ ansible_facts['distribution_major_version'] }}.yml"
  loop_control:
    loop_var: __desktop_vars_file_item
  vars:
    __desktop_vars_file: "{{ role_path }}/vars/{{ __desktop_vars_file_item }}"
  when: __desktop_vars_file is file

- name: Run shared setup tasks
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/setup/default.yml"

- name: Run platform-specific setup tasks
  ansible.builtin.include_tasks: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_facts['distribution'] }}_{{ ansible_facts['distribution_major_version'] }}.yml"
      paths:
        - "{{ role_path }}/tasks/setup"
      skip: true
