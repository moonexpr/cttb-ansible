---

  - name: install lubuntu
    apt:
      state: present
      install_recommends: no
      name:
      - alsa-utils
      - alsamixergui
      - desktop-file-utils
      - dmz-cursor-theme
      - evince
      - file-roller
      - gedit
      - devilspie2
      - gnome-calculator
      - gnome-characters
      - gnome-system-monitor
      - gnome-system-tools
      - indicator-application
      - libpolkit-agent-1-0
      - libpolkit-gobject-1-0
      - libpolkit-qt5-1-1
      - lightdm-gtk-greeter-settings
      - light-locker
      - light-locker-settings
      - lubuntu-artwork
      - lubuntu-default-settings
      - lxappearance
      - lxappearance-obconf
      - lximage-qt
      - lxinput
      - lxlauncher
      - lxqt-config
      - lxqt-globalkeys
      - lxqt-panel
      - lxqt-powermanagement
      - lxrandr
      - lxsession-default-apps
      - lxsession-logout
      - lxterminal
      - network-manager
      - network-manager-gnome
      - obconf
      - pcmanfm-qt
      - pm-utils
      - policykit-1
      - policykit-1-gnome
      - xscreensaver
      - scrot
      - simple-scan
      - system-tools-backends
      - xdg-user-dirs
      - xdotool
      # XFCE4 session itself — ships /usr/share/xsessions/xfce.desktop so
      # LightDM `user-session=xfce` actually picks up an XFCE session
      # instead of silently falling back to LXQt. Without these, fresh
      # PXE installs land in LXQt and skip every xfconf/xfce4-panel customization
      # the rest of this role applies.
      - xfce4-session
      - xfdesktop4
      - xfce4-settings
      - thunar
      - xfce4-panel
      - xfce4-power-manager
      - xfce4-appmenu-plugin
      - xfce4-genmon-plugin
      - xfce4-pulseaudio-plugin
      - xfce4-whiskermenu-plugin
      - xfce4-notifyd
      - xfce4-appfinder
      - appmenu-gtk3-module
      - appmenu-registrar
      - xfwm4
      - xserver-xorg
      - xz-utils
    tags:
      - packages
      - lubuntu

  # overrides lubuntu default triggering the LXDE session to be loaded which
  # in turns make lxde pick up the wrong configs.
  - name: remove lxde-common
    apt:
      name: lxde-common
      state: absent
    tags:
      - packages
      - lubuntu

  # Remove unneeded lubuntu pkgs.
  - name: remove unneeded lubuntu pkgs
    apt:
      state: absent
      name:
      - galculator
      - galternatives
      - gnome-disk-utility
      - gnome-font-viewer
      - qlipper
    tags:
      - packages
      - lubuntu

  # Did not exist in Lubuntu 20.04.
  - name: create /usr/share/lubuntu/images/ if it does not exist
    file:
      path: /usr/share/lubuntu/images
      state: directory
      mode: '0755'
    tags:
      - lubuntu
