---
# Sudhanix boot splash via Plymouth.
# Theme assets live in files/plymouth/sudhanix/; this file wires them up.
#
# Two-block phase shape (issue #57, Task 4):
#   install: apt plymouth packages, themes-dir mkdir, stale-asset purge,
#            theme-file deploy.
#   configure: update-alternatives, /etc/default/grub cmdline edit,
#              update-grub, update-initramfs (rebuild based on changed
#              install-block state).

- name: plymouth — install phase
  when: __sudhanix_phase | default("all") in ["install", "all"]
  tags:
    - install
    - plymouth
  block:

    - name: install plymouth packages
      apt:
        name:
          - plymouth
          - plymouth-themes
          - plymouth-label
        state: present
      tags:
        - sudhanix-core
        - plymouth
        - install

    - name: ensure plymouth themes dir exists
      file:
        path: /usr/share/plymouth/themes/sudhanix
        state: directory
        mode: 0755
        owner: root
        group: root
      tags:
        - sudhanix-core
        - plymouth
        - install

    - name: remove stale plymouth assets not in the current theme
      file:
        path: "/usr/share/plymouth/themes/sudhanix/{{ item }}"
        state: absent
      loop:
        - lotus.png
        - amitabha.png
      tags:
        - sudhanix-core
        - plymouth
        - install

    - name: deploy plymouth theme files
      copy:
        src: "plymouth/sudhanix/{{ item }}"
        dest: "/usr/share/plymouth/themes/sudhanix/{{ item }}"
        mode: 0644
        owner: root
        group: root
      loop:
        - sudhanix.plymouth
        - sudhanix.script
        - global_logo.png
        - progress-bg.png
        - progress-fill.png
      register: plymouth_assets
      tags:
        - sudhanix-core
        - plymouth
        - install

- name: plymouth — configure phase
  when: __sudhanix_phase | default("all") in ["config", "all"]
  tags:
    - config
    - plymouth
  block:

    # Point /etc/alternatives/default.plymouth at our theme. This is the
    # `update-alternatives` half of what plymouth-set-default-theme does —
    # we run it directly because the helper binary isn't on root's PATH in
    # all Noble installs and the `-R` rebuild half is done explicitly below.
    - name: set sudhanix as default plymouth theme (alternatives)
      community.general.alternatives:
        name: default.plymouth
        path: /usr/share/plymouth/themes/sudhanix/sudhanix.plymouth
        link: /etc/alternatives/default.plymouth
      register: plymouth_alt
      tags:
        - sudhanix-core
        - plymouth
        - config

    # Rebuild initramfs whenever ANY plymouth asset changed (or the
    # alternatives link moved). Without this, initramfs keeps stale theme
    # files and shows the old splash on the first boot frames before the
    # real rootfs takes over. Caught on dvgs-testmachine 2026-05-12 where
    # the old lotus.png stayed baked into initramfs for several boots.
    #
    # `plymouth_assets` is registered in install block. Cross-block register
    # reference works because both blocks live in the same play after
    # phase-gate evaluation; install block runs first when both phases run.
    # When run under --tags config alone, plymouth_assets is unset; default
    # to non-changed so the rebuild only fires when explicitly triggered.
    - name: rebuild initramfs when plymouth assets changed
      command: update-initramfs -u
      environment:
        PATH: /usr/sbin:/usr/bin:/sbin:/bin
      when: (plymouth_assets.changed | default(false)) or plymouth_alt.changed
      tags:
        - sudhanix-core
        - plymouth
        - config

    - name: ensure quiet splash on kernel cmdline
      lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
        line: 'GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"'
      register: grub_cmdline
      tags:
        - sudhanix-core
        - plymouth
        - config

    - name: update-grub if cmdline changed
      command: update-grub
      when: grub_cmdline.changed
      tags:
        - sudhanix-core
        - plymouth
        - config
