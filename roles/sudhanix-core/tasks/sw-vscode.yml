---
# Visual Studio Code installation. Pure install (apt key + apt repo +
# apt install + cleanup of deb822 .sources file the package auto-creates).
#
# Two-block phase shape (issue #57, Task 5): single install block, no
# configure block.

  - name: sw-vscode — install phase
    when: __sudhanix_phase | default("all") in ["install", "all"]
    tags:
      - install
      - vscode
    block:

      - block:
        - name: download Microsoft signing key
          get_url:
            url: https://packages.microsoft.com/keys/microsoft.asc
            dest: /usr/share/keyrings/microsoft.asc
            mode: '0644'
          register: _vscode_key
          until: _vscode_key is succeeded
          retries: 3
          delay: 5

        - name: add VSCode repository
          apt_repository:
            repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.asc] https://packages.microsoft.com/repos/code stable main"
            state: present
            filename: vscode

        # the code package auto-creates vscode.sources (deb822) with a different key — remove it
        - name: remove duplicate VSCode repository (auto-created by package)
          file:
            path: /etc/apt/sources.list.d/vscode.sources
            state: absent

        - name: remove stale microsoft.gpg key (package ships its own)
          file:
            path: /usr/share/keyrings/microsoft.gpg
            state: absent

        - name: install Visual Studio Code
          apt:
            name: code
            state: present
            update_cache: yes

        # packages.microsoft.com is the only off-campus apt source in the
        # role; an outage there must not abort the whole play.
        rescue:
        - name: surface VSCode install failure (VSCode skipped this run)
          debug:
            msg: >-
              VSCode setup failed on {{ inventory_hostname }}
              (task '{{ ansible_failed_task.name | default("unknown") }}':
              {{ ansible_failed_result.msg | default("no message") }}).
              VSCode was NOT installed; the play continues.

        when: vscode == true
        tags:
          - packages
          - vscode
