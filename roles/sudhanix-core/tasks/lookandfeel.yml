---
# Look-and-feel tasks for sudhanix-core.
#
# Two-block phase gate (issue #57, Task 2):
#   install block  — apt removes, tarball unarchives, static asset copies
#                    (themes, fonts, icons). Runs in install phase.
#   configure block — templates, lineinfile, polkit-style config copies,
#                    skel deployment, NetworkManager swap, app-menu wiring.
#                    Runs in configure phase, after handlers flush.
#
# Selection mechanism: each block is gated by `when: __sudhanix_phase`.
# install.yml includes this file with vars __sudhanix_phase=install;
# configure.yml includes it with vars __sudhanix_phase=config. The other
# block's `when:` evaluates false and Ansible skips its body. This avoids
# the file being executed twice while keeping a single named home per
# subsystem (the structure the operator chose during planning).
#
# When invoked outside the phase orchestrators (e.g., a direct
# `--start-at-task` rescue), __sudhanix_phase defaults to "all" and both
# blocks fire, matching pre-refactor behavior.

  # ──────────────────────────────────────────────────────────────────
  # Install block — provisioning side: themes, fonts, icons, static
  # assets. Every task here writes a file or extracts a tarball.
  # ──────────────────────────────────────────────────────────────────
  - name: lookandfeel — install phase
    when: __sudhanix_phase | default("all") in ["install", "all"]
    tags:
      - install
      - lookandfeel
    block:

      # gnome-shell: a few buttons at left, status on top. Default in Lubuntu
      # 20.04 install. Not CTTB Lubuntu style, must remove it.
      - name: remove gnome-shell
        apt:
          state: absent
          name: gnome-shell
        tags:
          - sudhanix-core
          - packages

      # WhiteSur theme has to land before any lightdm-greeter task because the
      # CSS deploy (configure block) writes into
      # /usr/share/themes/{{desktop_theme}}/gtk-3.0/. With the phase gate this
      # is now structurally enforced — install block always runs before
      # configure block.
      - name: install WhiteSur GTK theme
        unarchive:
          remote_src: yes
          src: "{{ansible_assets_url}}/WhiteSur-gtk-theme.tar.gz"
          dest: /usr/share/themes/
          creates: /usr/share/themes/WhiteSur
          owner: root
          group: root
        tags:
          - sudhanix-core
          - theme

      - name: bidirectional WhiteSur theme/icon casing symlinks
        file:
          src: "{{ item.src }}"
          dest: "{{ item.dest }}"
          state: link
          force: yes
        loop:
          - { src: WhiteSur,      dest: /usr/share/themes/WhiteSur-light }
          - { src: WhiteSur,      dest: /usr/share/themes/WhiteSur-Light }
          - { src: WhiteSur-Dark, dest: /usr/share/themes/WhiteSur-dark }
          - { src: WhiteSur-light, dest: /usr/share/icons/WhiteSur-Light }
          - { src: WhiteSur-dark,  dest: /usr/share/icons/WhiteSur-Dark }
        tags:
          - sudhanix-core
          - theme
          - config
          - lookandfeel

      - name: copy lightdm avatar image
        copy:
          src: "pics/{{pic_avatar}}"
          dest: /usr/share/lubuntu/images/avatar.png
          mode: 0644
          owner: root
          group: root
        tags:
          - lightdm

      - name: copy koha icon
        copy:
          src: pics/koha.gif
          dest: /usr/share/icons/koha.gif
          mode: 0644
          owner: root
          group: root
        tags:
          - sudhanix-core
          - icons

      - name: install Inter Display font
        unarchive:
          remote_src: yes
          src: "{{ansible_assets_url}}/InterDisplay.tar.gz"
          dest: /usr/share/fonts/truetype/
          creates: /usr/share/fonts/truetype/inter-display
          owner: root
          group: root
        notify: rebuild font cache
        tags:
          - sudhanix-core
          - fonts

      - name: ensure SeriousShanns font directory exists
        file:
          path: /usr/share/fonts/opentype/serious-shanns
          state: directory
          mode: 0755
          owner: root
          group: root
        tags:
          - sudhanix-core
          - fonts

      - name: install SeriousShanns Nerd Font Mono
        unarchive:
          remote_src: yes
          src: "{{ansible_assets_url}}/SeriousShannsNerdFontMono.tar.gz"
          dest: /usr/share/fonts/opentype/serious-shanns/
          creates: /usr/share/fonts/opentype/serious-shanns/SeriousShannsNerdFontMono-Regular.otf
          owner: root
          group: root
        notify: rebuild font cache
        tags:
          - sudhanix-core
          - fonts

      - name: deploy CTTB lotus icon for panel menu
        file:
          path: /usr/share/icons/cttb
          state: directory
          mode: 0755
          owner: root
          group: root
        tags:
          - sudhanix-core
          - icons

      # PNG is the live icon — xfce4-panel.xml.j2 references this path.
      # The legacy SVG companion was retired 2026-05-11; no remaining
      # references depend on /usr/share/icons/cttb/lotus.svg.
      - name: copy lotus icon (png, panel)
        copy:
          src: pics/lotus.png
          dest: /usr/share/icons/cttb/lotus.png
          mode: 0644
          owner: root
          group: root
        tags:
          - sudhanix-core
          - icons

      - name: install WhiteSur icon theme (includes dark variant)
        unarchive:
          remote_src: yes
          src: "{{ansible_assets_url}}/WhiteSur-icon-theme.tar.gz"
          dest: /usr/share/icons/
          creates: /usr/share/icons/WhiteSur-dark
          owner: root
          group: root
        tags:
          - sudhanix-core
          - theme

      - name: install WhiteSur cursors
        unarchive:
          remote_src: yes
          src: "{{ansible_assets_url}}/WhiteSur-cursors.tar.gz"
          dest: /usr/share/icons/
          creates: /usr/share/icons/WhiteSur-cursors
          owner: root
          group: root
        tags:
          - sudhanix-core
          - theme

      # The WhiteSur-cursors tarball was built on macOS: it ships a stunted
      # index.theme (no Inherits, "WhiteSur Cursors" display name that
      # doesn't match the dir), no cursor.theme at all, and ~600 AppleDouble
      # ._* turds. xcursor resolves by dir name so cursors render, but the
      # missing cursor.theme + AppleDouble noise fail the issue's acceptance
      # and leave the greeter falling back to the default arrow. Ship correct
      # metadata and purge the resource-fork files.
      - name: deploy correct WhiteSur-cursors theme metadata
        copy:
          src: WhiteSur-cursors.theme
          dest: "/usr/share/icons/WhiteSur-cursors/{{ item }}"
          mode: '0644'
          owner: root
          group: root
        loop:
          - cursor.theme
          - index.theme
        tags:
          - sudhanix-core
          - theme

      - name: purge AppleDouble turds from WhiteSur-cursors tree
        shell: find /usr/share/icons/WhiteSur-cursors -name '._*' -delete -print
        register: whitesur_appledouble_purge
        changed_when: whitesur_appledouble_purge.stdout | length > 0
        tags:
          - sudhanix-core
          - theme

      - name: register WhiteSur-cursors as the system default x-cursor-theme
        community.general.alternatives:
          name: x-cursor-theme
          path: /usr/share/icons/WhiteSur-cursors/cursor.theme
          link: /usr/share/icons/default/index.theme
          priority: 100
        tags:
          - sudhanix-core
          - theme

      # Plank custom dock theme — sourced from
      # https://github.com/jothi-prasath/SmallSur/tree/master/plank/mcOS-BS-iMacM1-Black
      # The dconf seeds in files/dconf-db/00-plank-dock1 and
      # files/firstlogin/dconf-seeds/plank.txt select this theme by name.
      - name: ensure plank custom-themes dir
        file:
          path: /usr/share/plank/themes/mcOS-BS-iMacM1-Black
          state: directory
          owner: root
          group: root
          mode: '0755'
        tags:
          - sudhanix-core
          - theme

      - name: deploy plank mcOS-BS-iMacM1-Black dock theme
        copy:
          src: plank-themes/mcOS-BS-iMacM1-Black/dock.theme
          dest: /usr/share/plank/themes/mcOS-BS-iMacM1-Black/dock.theme
          owner: root
          group: root
          mode: '0644'
        tags:
          - sudhanix-core
          - theme

      - name: symlink Thunar icon to WhiteSur Finder-style file-manager icon
        file:
          src: file-manager.svg
          dest: /usr/share/icons/WhiteSur/apps/scalable/org.xfce.thunar.svg
          state: link
          force: yes
        tags:
          - sudhanix-core
          - theme

  # ──────────────────────────────────────────────────────────────────
  # Configure block — settings side: templates, lineinfile, polkit-shape
  # config copies, skel, app-menu, NetworkManager swap. Everything here
  # reads from the artifacts the install block left on disk.
  # ──────────────────────────────────────────────────────────────────
  - name: lookandfeel — configure phase
    when: __sudhanix_phase | default("all") in ["config", "all"]
    tags:
      - config
      - lookandfeel
    block:

      - name: setup default account files
        copy:
          src: config/etc-skel/
          dest: /etc/skel/
        tags:
          - sudhanix-core
          - config
          - install
          - lookandfeel
          - skel

      - block: # when icons on the desktop are defined

        - name: create Desktop in skel
          file:
            path: /etc/skel/Desktop
            state: directory
            mode: 0755

        - name: add desktop shortcuts
          copy:
            src: "desktop-shortcuts/{{item}}.desktop"
            dest: /etc/skel/Desktop/
            mode: 0644
            owner: root
            group: root
          loop: "{{ desktop_shortcuts }}"
          when: desktop_shortcuts | length > 0
          tags:
            - sudhanix-core
            - shortcuts

      - name: configure lightdm
        template:
          src: lightdm.j2
          dest: /etc/lightdm/lightdm.conf
          mode: 0644
          owner: root
          group: root
        notify: restart lightdm
        tags:
          - lightdm

      - name: configure lightdm gtk greeter
        template:
          src: lightdm-gtk-greeter.j2
          dest: /etc/lightdm/lightdm-gtk-greeter.conf
          mode: 0644
          owner: root
          group: root
        notify: restart lightdm
        tags:
          - lightdm

      - name: deploy greeter CSS (macOS-style login box)
        copy:
          src: config/lightdm-gtk-greeter.css
          dest: /usr/share/themes/{{desktop_theme}}/gtk-3.0/lightdm-gtk-greeter.css
          mode: 0644
          owner: root
          group: root
        notify: restart lightdm
        tags:
          - lightdm

      - name: ensure theme imports greeter CSS
        lineinfile:
          path: /usr/share/themes/{{desktop_theme}}/gtk-3.0/gtk.css
          line: '@import url("lightdm-gtk-greeter.css");'
          insertafter: EOF
        notify: restart lightdm
        tags:
          - lightdm

      - name: ensure lightdm is the active display manager
        shell: echo "/usr/sbin/lightdm" > /etc/X11/default-display-manager
        args:
          creates: /etc/X11/default-display-manager
        tags:
          - lightdm

      # Lubuntu 24.04 only has lxde-applications.menu; LXQt panel expects lxqt-applications.menu
      - name: symlink lxqt-applications.menu for panel compatibility
        file:
          src: lxde-applications.menu
          dest: /etc/xdg/menus/lxqt-applications.menu
          state: link
          force: yes
        when: ansible_distribution_major_version | int >= 24
        tags:
          - sudhanix-core

      - name: deploy custom XFCE applications menu
        template:
          src: xfce-applications.menu.j2
          dest: /etc/xdg/menus/xfce-applications.menu
          mode: 0644
          owner: root
          group: root
        tags:
          - sudhanix-core
          - app_menu

      - name: deploy hostname menu entry
        template:
          src: cttb-hostname.desktop.j2
          dest: /usr/share/applications/cttb-hostname.desktop
          mode: 0644
          owner: root
          group: root
        tags:
          - sudhanix-core
          - app_menu

      - name: deploy signoff, sleep and shutdown menu entries
        copy:
          src: "desktop-entries/{{ item }}"
          dest: "/usr/share/applications/{{ item }}"
          mode: 0644
          owner: root
          group: root
        loop:
          - cttb-signoff.desktop
          - cttb-sleep.desktop
          - cttb-shutdown.desktop
          - cttb-reboot.desktop
        tags:
          - sudhanix-core
          - app_menu

      - name: ensure xfwm4 config directory exists
        file:
          path: /etc/xdg/xfce4/xfconf/xfce-perchannel-xml
          state: directory
          mode: 0755
          owner: root
          group: root
        tags:
          - sudhanix-core

      - name: configure xfce4 xsettings (font, theme, cursor)
        template:
          src: xsettings.xml.j2
          dest: /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
          mode: 0644
          owner: root
          group: root
        tags:
          - sudhanix-core
          - config

      - name: configure xfwm4 window manager
        template:
          src: xfwm4.xml.j2
          dest: /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml
          mode: 0644
          owner: root
          group: root
        tags:
          - sudhanix-core

      - name: enable GTK global menu module in /etc/environment
        lineinfile:
          path: /etc/environment
          regexp: '^GTK_MODULES='
          line: 'GTK_MODULES=appmenu-gtk-module'
        tags:
          - sudhanix-core

      - name: enable UBUNTU_MENUPROXY in /etc/environment
        lineinfile:
          path: /etc/environment
          regexp: '^UBUNTU_MENUPROXY='
          line: 'UBUNTU_MENUPROXY=1'
        tags:
          - sudhanix-core

      - name: force system window decorations for GTK apps
        lineinfile:
          path: /etc/environment
          regexp: '^GTK_CSD='
          line: 'GTK_CSD=0'
        tags:
          - sudhanix-core

      - name: force system titlebar for Mozilla apps
        lineinfile:
          path: /etc/environment
          regexp: '^MOZ_GTK_TITLEBAR_DECORATION='
          line: 'MOZ_GTK_TITLEBAR_DECORATION=system'
        tags:
          - sudhanix-core

      - name: ensure Chrome policy directory exists
        file:
          path: /etc/opt/google/chrome/policies/managed
          state: directory
          mode: '0755'
          owner: root
          group: root
        when: chrome == true
        tags:
          - sudhanix-core

      - name: force Chrome to use system titlebar
        copy:
          content: '{"UseSystemTitleBar": true}'
          dest: /etc/opt/google/chrome/policies/managed/cttb-titlebar.json
          mode: '0644'
          owner: root
          group: root
        when: chrome == true
        tags:
          - sudhanix-core

      - name: configure xfce4 panel (top bar + dock with global menu)
        template:
          src: xfce4-panel.xml.j2
          dest: /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml
          mode: 0644
          owner: root
          group: root
        tags:
          - sudhanix-core

      - name: deploy panel hostname script (genmon)
        copy:
          src: config/panel-hostname.sh
          dest: /usr/local/bin/panel-hostname.sh
          mode: '0755'
          owner: root
          group: root
        tags:
          - sudhanix-core

      - name: ensure xfce4 kiosk directory exists
        file:
          path: /etc/xdg/xfce4/kiosk
          state: directory
          mode: 0755
          owner: root
          group: root
        tags:
          - sudhanix-core

      - name: ensure /etc/xdg/gtk-3.0 exists
        file:
          path: /etc/xdg/gtk-3.0
          state: directory
          mode: 0755
          owner: root
          group: root
        tags:
          - sudhanix-core

      - name: deploy panel GTK CSS override (semibold font, icon spacing)
        copy:
          src: config/gtk-panel.css
          dest: /etc/xdg/gtk-3.0/gtk.css
          mode: 0644
          owner: root
          group: root
        tags:
          - sudhanix-core

      - name: lock panel customization (sudo group only)
        copy:
          src: config/kioskrc
          dest: /etc/xdg/xfce4/kiosk/kioskrc
          mode: 0644
          owner: root
          group: root
        tags:
          - sudhanix-core

      - name: configure openbox
        template:
          src: openbox-rc.j2
          dest: /etc/xdg/openbox/lxqt-rc.xml
          mode: 0644
          owner: root
          group: root
        when: desktop_session != 'xfce'
        tags:
          - sudhanix-core

      # Lubuntu 20.04 uses lxqt-panel. System default conf file is at /usr/share/lxqt/panel.conf. This defines the panel's behavior and look and feel.
      - name: configure lxpanel
        template:
          src: lxpanel.j2
          dest: /usr/share/lxqt/panel.conf
          mode: 0644
          owner: root
          group: root
        when: desktop_session != 'xfce'
        tags:
          - sudhanix-core

      # gh-85: lxqt-panel is installed (lubuntu.yml package set) but on a
      # Sudhanix XFCE session it is never configured (the lxpanel task above
      # is `when: desktop_session != 'xfce'`). Its pkg-shipped autostart entry
      # /etc/xdg/autostart/lxqt-panel.desktop carries no OnlyShowIn/NotShowIn
      # guard, so it still launches inside startxfce4 and reserves a default
      # bottom-edge strut — invisible, but it pushes the Plank dock up off the
      # edge by a variable amount. Per the XDG autostart spec a Hidden=true
      # entry of the same name MUST be ignored, so overwrite the autostart
      # entry with a Hidden override. Not removing the lxqt-panel package
      # (other lubuntu-core deps reference it; removal risks desktop regress).
      - name: gh-85 suppress vestigial lxqt-panel autostart in XFCE session
        copy:
          dest: /etc/xdg/autostart/lxqt-panel.desktop
          mode: 0644
          owner: root
          group: root
          content: |
            [Desktop Entry]
            Type=Application
            Name=lxqt-panel (disabled — Sudhanix uses xfce4-panel + Plank)
            Exec=true
            Hidden=true
            X-GNOME-Autostart-enabled=false
        when: desktop_session == 'xfce'
        tags:
          - sudhanix-core
          - lxqt-panel-suppress

      # Use NetworkManager to manage networks instead of the default netplan on 20.04.
      - name: remove netplan's default config file
        file:
          path: /etc/netplan/01-netcfg.yaml
          state: absent
        tags:
          - network

      - name: use NetworkManager instead of netplan to manage networks
        copy:
          src: config/01-network-manager-all.yaml
          dest: /etc/netplan/
          mode: 0644
          owner: root
          group: root
        tags:
          - network

      # Lubuntu 20.04 system default theme is in /usr/share/lxqt/lxqt.conf.
      - name: configure desktop theme
        template:
          src: lxqt-conf.j2
          dest: /usr/share/lxqt/lxqt.conf
          mode: 0644
          owner: root
          group: root
        when: desktop_session != 'xfce'
        tags:
          - sudhanix-core

      # Lubuntu 20.04 system default icon_theme is in /etc/gtk-3.0/settings.ini.
      - name: configure default icon theme
        template:
          src: gtk-3.0-settings.j2
          dest: /etc/gtk-3.0/settings.ini
          mode: 0644
          owner: root
          group: root
        when: desktop_session != 'xfce'
        tags:
          - sudhanix-core

      - name: configure lxsession
        template:
          src: lxsession.j2
          dest: /usr/share/lxqt/session.conf
          mode: 0644
          owner: root
          group: root
        when: desktop_session != 'xfce'
        tags:
          - sudhanix-core

      - name: configure pcmanfm-qt
        template:
          src: pcmanfm.j2
          dest: /usr/share/pcmanfm-qt/lxqt/settings.conf
          mode: 0644
          owner: root
        when: desktop_session != 'xfce'
        tags:
          - sudhanix-core

      - name: configure lxterminal
        copy:
          src: "config/lxterminal.conf"
          dest: /usr/share/lxterminal/lxterminal.conf
          mode: 0644
          owner: root
          group: root
        when: desktop_session != 'xfce'
        tags:
          - sudhanix-core
          - lxterminal

      - name: ensure xfce4-terminal config directory exists
        file:
          path: /etc/xdg/xfce4/terminal
          state: directory
          mode: '0755'
          owner: root
          group: root
        tags:
          - sudhanix-core

      - name: configure xfce4-terminal (Man Page theme)
        copy:
          src: config/terminalrc
          dest: /etc/xdg/xfce4/terminal/terminalrc
          mode: '0644'
          owner: root
          group: root
        tags:
          - sudhanix-core

      # /etc/xdg/mimeapps.list — pin gedit as the default text/plain
      # handler (so .txt / .md / .conf / .log open in gedit, not
      # LibreOffice Writer); also pin google-chrome.desktop for the
      # http/https/about/mailto schemes as a system-level fallback
      # behind ~/.config/mimeapps.list. Touches #71 directly and the
      # browser side of #62. Lubuntu 24.04 ships no system file, so
      # the mimeinfo.cache alphabetical-first fallback was landing
      # text/plain on LibreOffice.
      - name: deploy system mimeapps.list (gedit text/plain, chrome web)
        copy:
          src: config/mimeapps.list
          dest: /etc/xdg/mimeapps.list
          mode: '0644'
          owner: root
          group: root
        tags:
          - sudhanix-core
          - mimeapps

      # Operator-facing diagnostic scripts for the Super-key family
      # (gh-61, gh-63) and default-browser dispatch (gh-62). Invoke via
      # `vajra lua /usr/local/share/sudhanix/diag/<name>.lua` over SSH
      # (with `bash -lc` to get a login env) or from inside a desktop
      # session. World-readable; the scripts make no privileged calls.
      - name: ensure sudhanix diag dir
        file:
          path: /usr/local/share/sudhanix/diag
          state: directory
          mode: '0755'
          owner: root
          group: root
        tags:
          - sudhanix-core
          - diag

      - name: deploy sudhanix diag scripts
        copy:
          src: "diag/{{ item }}"
          dest: "/usr/local/share/sudhanix/diag/{{ item }}"
          mode: '0644'
          owner: root
          group: root
        loop:
          - super_key.lua          # gh-61 (Super+L lock) + gh-63 (Super menu toggle)
          - browser_default.lua    # gh-62 (default-browser dispatch failures)
        tags:
          - sudhanix-core
          - diag

      - include_tasks: app-menu.yml
        tags:
          - app_menu

      # administrator acct: set keyboard shortcuts, autostarts an LXTerminal.
      - name: admin acct customization -- prep, creating folders
        file:
          path: '{{ item }}'
          state: directory
          mode: 0755
          owner: administrator
          group: administrator
        loop:
            - /home/administrator/.config/lxqt/
            - /home/administrator/.config/autostart/
        tags:
          - administrator

      - name: admin acct customization -- key shortcuts, autostarts an LXTerminal
        copy:
          src: '{{ item.src }}'
          dest: '{{ item.dest }}'
          mode: 0644
          owner: administrator
          group: administrator
        loop:
            - { src: 'config/etc-skel/.config/lxqt/globalkeyshortcuts.conf', dest: '/home/administrator/.config/lxqt/' }
            - { src: 'config/etc-skel/.config/autostart/LXTerminal.desktop', dest: '/home/administrator/.config/autostart/' }
        tags:
          - administrator
