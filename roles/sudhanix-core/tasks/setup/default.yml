---
# Shared desktop setup tasks — included from main.yml via dispatch.
# Based on desktop-22.04 task ordering (lang before lookandfeel).
#
# Tag strategy:
#   install — apt, tarballs, binary deploys, PAM hooks (one-off / rarely changes)
#   config  — xfconf, dconf, polkit rules, JSONs, theme settings (frequent updates)
#   Mixed files (lookandfeel, sound) carry BOTH so they run on either filter and
#   their config bits stay current; their install bits are idempotent and no-op
#   on re-runs.

  #when installing mini stuff ends up there and network manager refuses to touch it
  - name: fix network interfaces
    copy:
      content: |
        auto lo
        iface lo inet loopback
      dest: /etc/network/interfaces
      mode: 0644
      owner: root
      group: root
    tags:
      - install

  - name: Disallow regular user to disable/modify networking (polkit rules, 24.04+)
    copy:
      src: "config/10-network-manager.rules"
      dest: /etc/polkit-1/rules.d/10-network-manager.rules
      mode: 0644
      owner: root
      group: root
    when: ansible_distribution_major_version | int >= 24
    tags:
      - config
      - network_manager_permission

  - name: Disallow regular user to disable/modify networking (pkla, pre-24.04)
    copy:
      src: "config/10-network-manager.pkla"
      dest: /var/lib/polkit-1/localauthority/50-local.d/10-network-manager.pkla
      mode: 0644
      owner: root
      group: root
    when: ansible_distribution_major_version | int < 24
    tags:
      - config
      - network_manager_permission

  - name: Allow root to power off/reboot/... in crontab (polkit rules, 24.04+)
    copy:
      src: "config/20-allow-root-cron-to-power-off.rules"
      dest: /etc/polkit-1/rules.d/20-allow-root-cron-to-power-off.rules
      mode: 0644
      owner: root
      group: root
    when:
      - allow_root_crontab_power_off is defined
      - ansible_distribution_major_version | int >= 24
    tags:
      - config
      - allow_root_crontab_power_off

  - name: Allow root to power off/reboot/... in crontab (pkla, pre-24.04)
    copy:
      src: "config/20-allow-root-cron-to-power-off.pkla"
      dest: /var/lib/polkit-1/localauthority/50-local.d/20-allow-root-cron-to-power-off.pkla
      mode: 0644
      owner: root
      group: root
    when:
      - allow_root_crontab_power_off is defined
      - ansible_distribution_major_version | int < 24
    tags:
      - config
      - allow_root_crontab_power_off

  - name: Allow IT group to change hostname via pkexec (polkit rules, 24.04+)
    copy:
      src: "config/30-hostnamectl.rules"
      dest: /etc/polkit-1/rules.d/30-hostnamectl.rules
      mode: 0644
      owner: root
      group: root
    when: ansible_distribution_major_version | int >= 24
    tags:
      - config
      - polkit_hostnamectl

  - name: Allow IT group to change hostname via pkexec (pkla, pre-24.04)
    copy:
      src: "config/30-hostnamectl.pkla"
      dest: /var/lib/polkit-1/localauthority/50-local.d/30-hostnamectl.pkla
      mode: 0644
      owner: root
      group: root
    when: ansible_distribution_major_version | int < 24
    tags:
      - config
      - polkit_hostnamectl

  # Add /bin/bash as GS "student" account shell
  - name: Add /bin/bash as GS "student" account shell
    replace:
      dest: /etc/passwd
      regexp: "^student:x:2000:2000:Student:/home/student:.*"
      replace: "student:x:2000:2000:Student:/home/student:/bin/bash"
    when: '"dvgs" in group_names'
    tags:
      - install
      - gs_acct_shell

  # Add /bin/bash as GS "teacher" account shell
  - name: Add /bin/bash as GS "teacher" account shell
    replace:
      dest: /etc/passwd
      regexp: "^teacher:x:1999:1999:Teacher:/home/teacher:.*"
      replace: "teacher:x:1999:1999:Teacher:/home/teacher:/bin/bash"
    when: '"dvgs" in group_names'
    tags:
      - install
      - gs_acct_shell

  # install all lubuntu core packages
  - include_tasks:
      file: lubuntu.yml
      apply:
        tags: [install]
    tags:
      - install
      - lubuntu

  # install languages support. Moved before lookandfeel, since laf requires fcitx to be installed.
  - include_tasks:
      file: lang.yml
      apply:
        tags: [install]
    tags:
      - install
      - lang

  # MIXED: themes/fonts/gnome-shell-removal/netplan-removal install + xfconf/lightdm/panel config
  # Per-task tags inside the file disambiguate; no apply propagation here.
  - include_tasks:
      file: lookandfeel.yml
    tags:
      - install
      - config
      - lookandfeel

  # Plymouth boot splash — Sudhanix branding. Self-contained (apt install +
  # asset copy + default-theme + grub cmdline). See roles/sudhanix-core/tasks/plymouth.yml.
  - include_tasks:
      file: plymouth.yml
      apply:
        tags: [install]
    tags:
      - install
      - plymouth

  - include_tasks:
      file: sw.yml
      apply:
        tags: [install]
    tags:
      - install
      - sw_install
      - zoom
      - browser
      - thunderbird
      - vscode

  - include_tasks:
      file: sw-goldendict.yml
      apply:
        tags: [install]
    when: goldendict is defined
    tags:
      - install
      - sw_install

  - include_tasks:
      file: sudhanix-ux.yml
      apply:
        tags: [config]
    tags:
      - config
      - sudhanix-ux

  # All install — modprobe, apt deps, sound-theme tarball, legacy PulseAudio service
  - include_tasks:
      file: sound.yml
      apply:
        tags: [install]
    tags:
      - install
      - sound

  - include_tasks:
      file: wallpaper.yml
      apply:
        tags: [config]
    tags:
      - config
      - wallpaper

  # Autoremove before upgrade, to avoid unnecessary upgrades.
  - name: apt autoremove before upgrade
    apt:
      autoremove: yes
      purge: yes
    tags:
      - install
      - apt
      - apt_autoremove

  # upgrade to latest for release
  - name: update system
    apt:
      upgrade: full
      update_cache: yes
      cache_valid_time: 3600
      autoremove: yes
    tags:
      - install
      - os_upgrade

  - name: apt autoremove after upgrade
    apt:
      autoremove: yes
      purge: yes
    tags:
      - install
      - apt
      - apt_autoremove
