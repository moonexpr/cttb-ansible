---
# Customize the applications menu in lxqt-panel

  # First, update the lxqt-applications.menu file itself;
  # Then, update the individual .desktop files.

  - name: hide 'Lock Screen' from top menu
    lineinfile:
      path: /etc/xdg/menus/lxqt-applications.menu
      regexp: '^\s+<Menuname(.*)>Screensaver</Menuname>'
      line: '                        <!-- <Menuname\1>Screensaver</Menuname> -->'
      backrefs: yes
    tags:
      - app_menu

  - name: move 'Lock Screen' into Leave
    lineinfile:
      path: /usr/share/applications/lxqt-lockscreen.desktop
      regexp: '^Categories='
      line: Categories=System;X-Leave
    tags:
      - app_menu

  - name: hide Snap Store in the app menu
    lineinfile:
      dest: /var/lib/snapd/desktop/applications/snap-store_snap-store.desktop
      line: "NoDisplay=true"
    tags:
      - app_menu

  - name: hide apps in the app menu
    lineinfile:
      dest: "/usr/share/applications/{{ item }}.desktop"
      line: "NoDisplay=true"
    with_items:
      - fcitx
      # No need to show a generic Leave
      - lxqt-leave
      # Hibernate does not work.
      - lxqt-hibernate
      - qlipper
      # TeXInfo
      - info
      - vim
      # Additional Device Drivers
      - software-properties-drivers
      - org.debian.galternatives
      - nm-connection-editor
      - org.freedesktop.IBus.Setup.desktop
      - im-config
      - time
      - software-property-gtk
      - users
      - obconf
      - fcitx-configtool
      - lightdm-gtk-greeter-settings
      - light-locker-settings
      - gnome-language-selector
      - xfce4-power-manager-settings
      - lxinput
      - lxqt-config-monitor
    tags:
      - app_menu
