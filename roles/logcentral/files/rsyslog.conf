#  /etc/rsyslog.conf	Configuration file for rsyslog.
#
#			For more information see
#			/usr/share/doc/rsyslog-doc/html/rsyslog_conf.html
#
#  Default logging rules can be found in /etc/rsyslog.d/50-default.conf


#################
#### MODULES ####
#################

#module(load="imuxsock") # provides support for local system logging
# Needs to be done just once.
# Default values for the interval and burst below are 0 seconds,
# which turns rate limiting off and 200.
# http://www.rsyslog.com/doc/v8-stable/configuration/modules/imuxsock.html
module(load="imuxsock" SysSock.RateLimit.Interval="5" SysSock.RateLimit.Burst="200")

#module(load="imklog")   # provides kernel logging support
$ModLoad imklog
#module(load="immark")  # provides --MARK-- message capability

# provides UDP syslog reception
module(load="imudp")
input(type="imudp" port="514")

# provides TCP syslog reception
#module(load="imtcp")
#input(type="imtcp" port="514")

# Enable non-kernel facility klog messages
$KLogPermitNonKernelFacility on

###########################
#### GLOBAL DIRECTIVES ####
###########################

# log every host in its own directory
$template RemoteHost,"/logs/remote-syslog/%HOSTNAME%/%$YEAR%-%$MONTH%/%$DAY%.log"

# Use traditional timestamp format.
# To enable high precision timestamps, comment out the following line.
#
$ActionFileDefaultTemplate RSYSLOG_TraditionalFileFormat

# Filter duplicated messages
$RepeatedMsgReduction on

#
# Set the default permissions for all log files.
#
$FileOwner syslog
$FileGroup adm
$FileCreateMode 0640
$DirCreateMode 0755
$Umask 0022
$PrivDropToUser syslog
$PrivDropToGroup syslog

#
# Where to place spool and state files
#
$WorkDirectory /var/spool/rsyslog


### Rulesets
# Local Logging
$RuleSet local
$IncludeConfig /etc/rsyslog.d/*.conf
$DefaultRuleset local

# Remote Logging
$RuleSet remote
*.* ?RemoteHost

### Rate limit to avoid flooding. Works only for the same logging process PID.
#http://unix.stackexchange.com/questions/299320/rsyslog-filling-up-var-log-puts-the-system-down
#$SystemLogRateLimitInterval 5
#$SystemLogRateLimitBurst 200
# New syntax:
# Default values for the interval and burst below are 0 seconds,
# which turns rate limiting off and 200.
# http://www.rsyslog.com/doc/v8-stable/configuration/modules/imuxsock.html
#SysSock.RateLimit.Interval 5
# 200 for burst is the default value.
#SysSock.RateLimit.Burst 200

### Listeners
# bind ruleset to listener and activate it:
$InputUDPServerBindRuleset remote
$UDPServerRun 514
