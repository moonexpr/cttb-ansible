---

  - name: install squid pkgs
    apt:
      name: squid
      state: latest
      install_recommends: yes
      update_cache: yes

  - name: deploy squid.conf
    template:
      src: squid.j2
      dest: /etc/squid/squid.conf
      owner: root
      group: root
      mode: 0640
    notify:
      - restart e2g
