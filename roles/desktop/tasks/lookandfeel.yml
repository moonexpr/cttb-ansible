---
# Customize look and feel

  - name: setup default account files
    copy:
      src: config/etc-skel/
      dest: /etc/skel/
    tags:
      - desktop

  # gnome-shell: a few buttons at left, status on top. Default in Lubuntu 20.04 install. Not CTTB Lubuntu style, must remove it.
  - name: remove gnome-shell
    apt:
      state: absent
      name: gnome-shell
    tags:
      - desktop
      - packages

  - block: # when icons on the desktop are defined

    - name: create Desktop in skel
      file:
        path: /etc/skel/Desktop
        state: directory
        mode: 0755

    - name: add desktop shortcuts
      copy:
        src: "desktop-shortcuts/{{item}}.desktop"
        dest: /etc/skel/Desktop/
        mode: 0644
        owner: root
        group: root
      loop: "{{ desktop_shortcuts }}"
      when: desktop_shortcuts | length > 0
      tags:
        - desktop
        - shortcuts

  - name: configure lightdm
    template:
      src: lightdm.j2
      dest: /etc/lightdm/lightdm.conf
      mode: 0644
      owner: root
      group: root
    notify: restart lightdm
    tags:
      - lightdm

  - name: configure lightdm gtk greeter
    template:
      src: lightdm-gtk-greeter.j2
      dest: /etc/lightdm/lightdm-gtk-greeter.conf
      mode: 0644
      owner: root
      group: root
    notify: restart lightdm
    tags:
      - lightdm

  - name: ensure lightdm is the active display manager
    shell: echo "/usr/sbin/lightdm" > /etc/X11/default-display-manager
    args:
      creates: /etc/X11/default-display-manager
    tags:
      - lightdm

  - name: copy lightdm avatar image
    copy:
      src: "pics/{{pic_avatar}}"
      dest: /usr/share/lubuntu/images/avatar.png
      mode: 0644
      owner: root
      group: root
    tags:
      - lightdm

  - name: deploy login background image
    copy:
      src: "pics/{{desktop_login_background}}"
      dest: /usr/share/lubuntu/wallpapers/background.jpg
      mode: 0644
      owner: root
      group: root
    tags:
      - lightdm

  - name: copy koha icon
    copy:
      src: pics/koha.gif
      dest: /usr/share/icons/koha.gif
      mode: 0644
      owner: root
      group: root
    tags:
      - desktop
      - icons

  - name: install Inter Display font
    unarchive:
      remote_src: yes
      src: "{{ansible_assets_url}}/InterDisplay.tar.gz"
      dest: /usr/share/fonts/truetype/
      creates: /usr/share/fonts/truetype/inter-display
      owner: root
      group: root
    notify: rebuild font cache
    tags:
      - desktop
      - fonts

  - name: install SeriousShanns Nerd Font Mono
    unarchive:
      remote_src: yes
      src: "{{ansible_assets_url}}/SeriousShannsNerdFontMono.tar.gz"
      dest: /usr/share/fonts/opentype/serious-shanns/
      creates: /usr/share/fonts/opentype/serious-shanns/SeriousShannsNerdFontMono-Regular.otf
      owner: root
      group: root
    notify: rebuild font cache
    tags:
      - desktop
      - fonts

  - name: deploy CTTB lotus icon for panel menu
    file:
      path: /usr/share/icons/cttb
      state: directory
      mode: 0755
      owner: root
      group: root
    tags:
      - desktop
      - icons

  - name: copy lotus icon
    copy:
      src: pics/lotus.svg
      dest: /usr/share/icons/cttb/lotus.svg
      mode: 0644
      owner: root
      group: root
    tags:
      - desktop
      - icons

  - name: install WhiteSur GTK theme
    unarchive:
      remote_src: yes
      src: "{{ansible_assets_url}}/WhiteSur-gtk-theme.tar.gz"
      dest: /usr/share/themes/
      creates: /usr/share/themes/WhiteSur
      owner: root
      group: root
    tags:
      - desktop
      - theme

  - name: install WhiteSur icon theme
    unarchive:
      remote_src: yes
      src: "{{ansible_assets_url}}/WhiteSur-icon-theme.tar.gz"
      dest: /usr/share/icons/
      creates: /usr/share/icons/WhiteSur
      owner: root
      group: root
    tags:
      - desktop
      - theme

  - name: install WhiteSur cursors
    unarchive:
      remote_src: yes
      src: "{{ansible_assets_url}}/WhiteSur-cursors.tar.gz"
      dest: /usr/share/icons/
      creates: /usr/share/icons/WhiteSur-cursors
      owner: root
      group: root
    tags:
      - desktop
      - theme

  - name: symlink Thunar icon to WhiteSur Finder-style file-manager icon
    file:
      src: file-manager.svg
      dest: /usr/share/icons/WhiteSur/apps/scalable/org.xfce.thunar.svg
      state: link
      force: yes
    tags:
      - desktop
      - theme

  # Lubuntu 24.04 only has lxde-applications.menu; LXQt panel expects lxqt-applications.menu
  - name: symlink lxqt-applications.menu for panel compatibility
    file:
      src: lxde-applications.menu
      dest: /etc/xdg/menus/lxqt-applications.menu
      state: link
      force: yes
    when: ansible_distribution_major_version | int >= 24
    tags:
      - desktop

  - name: deploy custom XFCE applications menu
    template:
      src: xfce-applications.menu.j2
      dest: /etc/xdg/menus/xfce-applications.menu
      mode: 0644
      owner: root
      group: root
    tags:
      - desktop
      - app_menu

  - name: deploy hostname menu entry
    template:
      src: cttb-hostname.desktop.j2
      dest: /usr/share/applications/cttb-hostname.desktop
      mode: 0644
      owner: root
      group: root
    tags:
      - desktop
      - app_menu

  - name: deploy sleep and shutdown menu entries
    copy:
      src: "desktop-entries/{{ item }}"
      dest: "/usr/share/applications/{{ item }}"
      mode: 0644
      owner: root
      group: root
    loop:
      - cttb-sleep.desktop
      - cttb-shutdown.desktop
    tags:
      - desktop
      - app_menu

  - name: ensure xfwm4 config directory exists
    file:
      path: /etc/xdg/xfce4/xfconf/xfce-perchannel-xml
      state: directory
      mode: 0755
      owner: root
      group: root
    tags:
      - desktop

  - name: configure xfce4 xsettings (font, theme, cursor)
    template:
      src: xsettings.xml.j2
      dest: /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
      mode: 0644
      owner: root
      group: root
    tags:
      - desktop

  - name: configure xfwm4 window manager
    template:
      src: xfwm4.xml.j2
      dest: /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml
      mode: 0644
      owner: root
      group: root
    tags:
      - desktop

  - name: enable GTK global menu module in /etc/environment
    lineinfile:
      path: /etc/environment
      regexp: '^GTK_MODULES='
      line: 'GTK_MODULES=appmenu-gtk-module'
    tags:
      - desktop

  - name: enable UBUNTU_MENUPROXY in /etc/environment
    lineinfile:
      path: /etc/environment
      regexp: '^UBUNTU_MENUPROXY='
      line: 'UBUNTU_MENUPROXY=1'
    tags:
      - desktop

  - name: force system window decorations for GTK apps
    lineinfile:
      path: /etc/environment
      regexp: '^GTK_CSD='
      line: 'GTK_CSD=0'
    tags:
      - desktop

  - name: force system titlebar for Mozilla apps
    lineinfile:
      path: /etc/environment
      regexp: '^MOZ_GTK_TITLEBAR_DECORATION='
      line: 'MOZ_GTK_TITLEBAR_DECORATION=system'
    tags:
      - desktop

  - name: ensure Chrome policy directory exists
    file:
      path: /etc/opt/google/chrome/policies/managed
      state: directory
      mode: '0755'
      owner: root
      group: root
    when: chrome == true
    tags:
      - desktop

  - name: force Chrome to use system titlebar
    copy:
      content: '{"UseSystemTitleBar": true}'
      dest: /etc/opt/google/chrome/policies/managed/cttb-titlebar.json
      mode: '0644'
      owner: root
      group: root
    when: chrome == true
    tags:
      - desktop

  - name: configure xfce4 panel (top bar + dock with global menu)
    template:
      src: xfce4-panel.xml.j2
      dest: /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml
      mode: 0644
      owner: root
      group: root
    tags:
      - desktop

  - name: deploy panel hostname script (genmon)
    copy:
      src: config/panel-hostname.sh
      dest: /usr/local/bin/panel-hostname.sh
      mode: '0755'
      owner: root
      group: root
    tags:
      - desktop

  - name: ensure xfce4 kiosk directory exists
    file:
      path: /etc/xdg/xfce4/kiosk
      state: directory
      mode: 0755
      owner: root
      group: root
    tags:
      - desktop

  - name: deploy panel GTK CSS override (semibold font, icon spacing)
    copy:
      src: config/gtk-panel.css
      dest: /etc/xdg/gtk-3.0/gtk.css
      mode: 0644
      owner: root
      group: root
    tags:
      - desktop

  - name: lock panel customization (sudo group only)
    copy:
      src: config/kioskrc
      dest: /etc/xdg/xfce4/kiosk/kioskrc
      mode: 0644
      owner: root
      group: root
    tags:
      - desktop

  - name: configure openbox
    template:
      src: openbox-rc.j2
      dest: /etc/xdg/openbox/lxqt-rc.xml
      mode: 0644
      owner: root
      group: root
    tags:
      - desktop

  # Lubuntu 20.04 uses lxqt-panel. System default conf file is at /usr/share/lxqt/panel.conf. This defines the panel's behavior and look and feel.
  - name: configure lxpanel
    template:
      src: lxpanel.j2
      dest: /usr/share/lxqt/panel.conf
      mode: 0644
      owner: root
      group: root
    tags:
      - desktop

  # Use NetworkManager to manage networks instead of the default netplan on 20.04.
  - name: remove netplan's default config file
    file:
      path: /etc/netplan/01-netcfg.yaml
      state: absent
    tags:
      - network

  - name: use NetworkManager instead of netplan to manage networks
    copy:
      src: config/01-network-manager-all.yaml
      dest: /etc/netplan/
      mode: 0644
      owner: root
      group: root
    tags:
      - network

  # Lubuntu 20.04 system default theme is in /usr/share/lxqt/lxqt.conf.
  - name: configure desktop theme
    template:
      src: lxqt-conf.j2
      dest: /usr/share/lxqt/lxqt.conf
      mode: 0644
      owner: root
      group: root
    tags:
      - desktop

  # Lubuntu 20.04 system default icon_theme is in /etc/gtk-3.0/settings.ini.
  - name: configure default icon theme
    template:
      src: gtk-3.0-settings.j2
      dest: /etc/gtk-3.0/settings.ini
      mode: 0644
      owner: root
      group: root
    tags:
      - desktop

  - name: configure lxsession
    template:
      src: lxsession.j2
      dest: /usr/share/lxqt/session.conf
      mode: 0644
      owner: root
      group: root
    tags:
      - desktop

  - name: configure pcmanfm-qt
    template:
      src: pcmanfm.j2
      dest: /usr/share/pcmanfm-qt/lxqt/settings.conf
      mode: 0644
      owner: root
    tags:
      - desktop

  - name: configure lxterminal
    copy:
      src: "config/lxterminal.conf"
      dest: /usr/share/lxterminal/lxterminal.conf
      mode: 0644
      owner: root
      group: root
    tags:
      - desktop
      - lxterminal

  - name: ensure xfce4-terminal config directory exists
    file:
      path: /etc/xdg/xfce4/terminal
      state: directory
      mode: '0755'
      owner: root
      group: root
    tags:
      - desktop

  - name: configure xfce4-terminal (Man Page theme)
    copy:
      src: config/terminalrc
      dest: /etc/xdg/xfce4/terminal/terminalrc
      mode: '0644'
      owner: root
      group: root
    tags:
      - desktop

  - include_tasks: app-menu.yml
    tags:
      - app_menu

  # administrator acct: set keyboard shortcuts, autostarts an LXTerminal.
  - name: admin acct customization -- prep, creating folders
    file:
      path: '{{ item }}'
      state: directory
      mode: 0755
      owner: administrator
      group: administrator
    loop:
        - /home/administrator/.config/lxqt/
        - /home/administrator/.config/autostart/
    tags:
      - administrator

  - name: admin acct customization -- key shortcuts, autostarts an LXTerminal
    copy:
      src: '{{ item.src }}'
      dest: '{{ item.dest }}'
      mode: 0644
      owner: administrator
      group: administrator
    loop:
        - { src: 'config/etc-skel/.config/lxqt/globalkeyshortcuts.conf', dest: '/home/administrator/.config/lxqt/' }
        - { src: 'config/etc-skel/.config/autostart/LXTerminal.desktop', dest: '/home/administrator/.config/autostart/' }
    tags:
      - administrator
