---
# Shared desktop setup tasks — included from main.yml via dispatch.
# Based on desktop-22.04 task ordering (lang before lookandfeel).

  #when installing mini stuff ends up there and network manager refuses to touch it
  - name: fix network interfaces
    copy:
      content: |
        auto lo
        iface lo inet loopback
      dest: /etc/network/interfaces
      mode: 0644
      owner: root
      group: root

  - name: Disallow regular user to disable/modify networking
    copy:
      src: "config/10-network-manager.pkla"
      dest: /var/lib/polkit-1/localauthority/50-local.d/10-network-manager.pkla
      mode: 0644
      owner: root
      group: root
    tags:
      - network_manager_permission

  - name: Allow root to power off/reboot/... in crontab
    copy:
      src: "config/20-allow-root-cron-to-power-off.pkla"
      dest: /var/lib/polkit-1/localauthority/50-local.d/20-allow-root-cron-to-power-off.pkla
      mode: 0644
      owner: root
      group: root
    when: allow_root_crontab_power_off is defined
    tags:
      - allow_root_crontab_power_off

  # Add /bin/bash as GS "student" account shell
  - name: Add /bin/bash as GS "student" account shell
    replace:
      dest: /etc/passwd
      regexp: "^student:x:2000:2000:Student:/home/student:.*"
      replace: "student:x:2000:2000:Student:/home/student:/bin/bash"
    when: '"dvgs" in group_names'
    tags:
      - gs_acct_shell

  # Add /bin/bash as GS "teacher" account shell
  - name: Add /bin/bash as GS "teacher" account shell
    replace:
      dest: /etc/passwd
      regexp: "^teacher:x:1999:1999:Teacher:/home/teacher:.*"
      replace: "teacher:x:1999:1999:Teacher:/home/teacher:/bin/bash"
    when: '"dvgs" in group_names'
    tags:
      - gs_acct_shell

  # install all lubuntu core packages
  - include_tasks: lubuntu.yml
    tags:
      - lubuntu

  # install languages support. Moved before lookandfeel, since laf requires fcitx to be installed.
  - include_tasks: lang.yml
    tags:
      lang

  # customize the desktop based on cttb/dvgs/dvbs etc
  - include_tasks: lookandfeel.yml
    tags:
      - lookandfeel

  - include_tasks: sw.yml
    tags:
      - sw_install

  - include_tasks: sw-goldendict.yml
    when: goldendict is defined

  - include_tasks: sound.yml
    tags:
      sound

  - include_tasks: wallpaper.yml
    tags:
      - wallpaper

  # Autoremove before upgrade, to avoid unnecessary upgrades.
  - name: apt autoremove before upgrade
    apt:
      autoremove: yes
      purge: yes
    tags:
      - apt
      - apt_autoremove

  # upgrade to latest for release
  - name: update system
    apt:
      upgrade: full
      update_cache: yes
      cache_valid_time: 3600
      autoremove: yes
    tags:
      - os_upgrade

  - name: apt autoremove after upgrade
    apt:
      autoremove: yes
      purge: yes
    tags:
      - apt
      - apt_autoremove
