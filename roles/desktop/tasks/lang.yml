  # disabled. Most ppl just want the vietnamese keyboard which is built-in
  #- name: install fcitx vietnamese/unikey support
  #  apt:
  #    name: fcitx-unikey
  #    state: present

  - name: install fcitx taiwanese/chewing support
    apt:
      name: fcitx-chewing
      state: present
