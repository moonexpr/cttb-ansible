---
#
#  ############### Sound STUFF ####################
#  1. Dell 2450 All-in-ones require a module option for the sound to work:
#     add a file alsa.conf in /etc/modprobe.d/ with the content:
#         options snd-hda-intel model=dell-headset-multi
#  2. Add a system pulseaudio service for all users to have sounds.

  - name: add /etc/modprobe.d/alsa.conf with a option for sound to work
    copy:
      content: "options snd-hda-intel model=dell-headset-multi\n"
      dest: /etc/modprobe.d/alsa.conf
      mode: 0644
      owner: root
      group: root
    when: dell_aio is defined
    tags:
      - sound

  # Ubuntu 24.04+ uses PipeWire/PulseAudio per-user; system-wide service not needed
  - name: add a system service for pulseaudio
    copy:
      src: "config/pulseaudio.service"
      dest: /etc/systemd/system/pulseaudio.service
      mode: 0644
      owner: root
      group: root
      force: no
    when: ansible_distribution_major_version | int < 24
    tags:
      - sound

  - name: enable the system pulseaudio service
    systemd:
      name: pulseaudio.service
      enabled: yes
      state: started
      scope: system
    notify: restart pulseaudio
    when: ansible_distribution_major_version | int < 24
    tags:
      - sound

