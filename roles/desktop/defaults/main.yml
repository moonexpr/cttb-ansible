---

# lightdm configuration
lightdm_hide_users: false
lightdm_autologin_user: ""
lightdm_autologin_timeout: 0

# sw install
wpsoffice: false
libreoffice: true
openoffice: false
firefox: true
chrome: true
vscode: true
dropbox: false
skype: false

# look and feel
desktop_shortcuts: []
desktop_theme: WhiteSur-Dark
desktop_session: xfce
desktop_font: "Inter 11"
desktop_title_font: "Inter 10"
gtk_theme: WhiteSur
icon_theme: WhiteSur
pic_avatar: avatar-cttb.png
pic_bg: bg-windos10.jpg
start_icon: WhiteSur/scalable/places/start-here.svg
cursor_theme: WhiteSur-cursors

# hardware
dell_aio: true

# wallpaper rotation (interval in hours)
desktop_wallpaper_interval_hours: 6
desktop_wallpaper_dir: /usr/share/backgrounds/cttb

# login background (defaults to pic_bg for backward compatibility)
desktop_login_background: "{{ pic_bg }}"
