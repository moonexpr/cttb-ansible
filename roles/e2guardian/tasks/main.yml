---

  - name: install e2guardian pkgs
    apt:
      name: e2guardian
      state: latest
      install_recommends: yes
      update_cache: yes

  - name: configure e2g global
    template:
      src: e2guardian.j2
      dest: /etc/e2guardian/e2guardian.conf
      owner: e2guardian
      group: e2guardian
      mode: 0640
    notify:
      - restart e2g

  - name: create e2g ipsgroup to assign machines to groups
    template:
      src: ipgroups.j2
      dest: "/etc/e2guardian/lists/authplugins/ipgroups"
      owner: e2guardian
      group: e2guardian
      mode: 0640
    notify:
      - restart e2g

  - name: create e2g filtering group dirs
    file:
      path: "/etc/e2guardian/f{{item.num}}"
      state: directory
      owner: e2guardian
      group: e2guardian
      mode: 0750
    with_items: "{{filtering_groups}}"

  - name: create e2g filtering group override dirs
    file:
      path: /etc/e2guardian/f{{item.num}}/overrides
      state: directory
      owner: e2guardian
      group: e2guardian
      mode: 0750
    with_items: "{{filtering_groups}}"

  - name: create e2g filtering group lists
    template:
      src: filtering-group-list-default.j2
      dest: "/etc/e2guardian/f{{item[0].num}}/{{item[1]}}"
      owner: e2guardian
      group: e2guardian
      mode: 0640
    with_nested:
      - "{{filtering_groups}}"
      - "{{filtering_groups_lists}}"
    notify:
      - restart e2g

  - name: deploy e2g filtering group override lists
    copy:
      src: "overrides/{{item.name}}/"
      dest: /etc/e2guardian/f{{item.num}}/overrides
      owner: e2guardian
      group: e2guardian
      mode: 0750
    with_items: "{{filtering_groups}}"
    tags:
      - e2g_overrides
    notify:
      - restart e2g

  - name: configure e2g group
    template:
      src: e2guardianfx.j2
      dest: /etc/e2guardian/e2guardianf{{item.num}}.conf
      owner: e2guardian
      group: e2guardian
      mode: 0640
    with_items: "{{filtering_groups}}"
    notify:
      - restart e2g



