---

  - name: configure dns resolution
    copy:
      src: resolv.conf
      dest: /etc/resolv.conf
      mode: 0644
      owner: root
      group: root

  - name: configure default grub #servers should give output on boot for debugging
    copy:
      src: default-grub
      dest: /etc/default/grub
      mode: 0644
      owner: root
      group: root
    notify:
      - update grub

  - name: remove some basic packages
    apt:
      name: "{{item}}"
      state: absent
      purge: yes
    with_items:
      - resolvconf
      - open-iscsi
      - lxc*
      - lxd-client
      - dnsmasq-base
      - libiscsi2

  - include: interfaces.yml
    when: server_interfaces is defined
    tags:
      - network
