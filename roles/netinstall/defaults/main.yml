---

ni_root_dir: /srv/netinstall
ni_tftp_dir: "{{ni_root_dir}}"
ni_preseed_dir: "{{ni_root_dir}}/preseed"
ni_pxe_menu_dir: "{{ni_root_dir}}/menu"
ni_isos_cache_dir: "{{ni_root_dir}}"
ni_isos_baseurl: "{{ansible_assets_url}}/isos"
ni_www_path: "/var/www/html/netinstall"
ni_memtest_iso_url: "{{ansible_assets_url}}/isos/memtest86-7.3.iso"

ni_livecds:
  - name: "Xenial 64"
    iso: "ubuntu-16.04.3-desktop-amd64.iso"
    help: "Ubuntu Desktop 16.04 64Bit"
  - name: "Xenial 32"
    iso: "ubuntu-16.04.3-desktop-i386.iso"
    help: "Ubuntu Desktop 16.04 32Bit"
  - name: RescaTux
    iso: "rescatux-0.41b1.iso"
    help: "Linux Rescue with Windows Tools"
  - name: UBCD
    iso: "ubcd537.iso"
    help: "Ultimate Boot CD - Rescue System"


ni_images:
  - name: xenial
    os: ubuntu
    type: mini
    arch: amd64
    url: "{{ni_isos_baseurl}}/ubuntu-mini-xenial-amd64.iso"
    preseed:
      - name: default
        description: "Default Installation" 
        kernel_path: linux
        initrd_path: initrd.gz
        partman: simple
      - name: server
        description: "Server Installation" 
        kernel_path: linux
        initrd_path: initrd.gz
        tasksel: server
        partman: simple
      - name: "srv-raid1"
        description: "Server raid 1" 
        kernel_path: linux
        initrd_path: initrd.gz
        tasksel: server
        partman: raid1
      - name: "srv-raid6"
        description: "Server Raid 10" 
        kernel_path: linux
        initrd_path: initrd.gz
        tasksel: server
        partman: raid6
      - name: desktop
        description: "Desktop Installation" 
        kernel_path: linux
        initrd_path: initrd.gz
        tasksel: lubuntu-desktop
        partman: simple
  - name: xenial
    os: ubuntu
    type: mini
    arch: i386
    url: "{{ni_isos_baseurl}}/ubuntu-mini-xenial-i386.iso"
    preseed:
      - name: default
        description: "Default Installation" 
        kernel_path: linux
        initrd_path: initrd.gz
        partman: simple
      - name: server
        description: "Server Installation" 
        kernel_path: linux
        initrd_path: initrd.gz
        tasksel: server
        partman: simple
      - name: desktop
        description: "Desktop Installation" 
        kernel_path: linux
        initrd_path: initrd.gz
        tasksel: lubuntu-desktop
        partman: simple
