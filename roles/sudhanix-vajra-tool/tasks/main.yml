---
# vajra — sysadmin multi-tool. Now distributed as a .deb from apt.cttb.
#
# The vajra source lives in ~/Garden/app/vajra (Rust + Lua tools, not in
# this repo). Production builds run on storehouse.cttb (cargo build +
# cargo deb) and the resulting .deb is published to apt.cttb's extras pool.
# This role just installs the package and templates the host-overridable
# JSON configs over the .deb-shipped defaults.
#
# Layout on disk after this role runs:
#   /usr/bin/vajra                          — binary (from .deb)
#   /usr/share/applications/vajra.desktop   — menu entry (from .deb)
#   /usr/local/lib/vajra/tools/             — drop-in Lua plugin dir (this role)
#   /etc/vajra/{quick-links,ldap,sudhanix}.json — configs (this role,
#                                                  override .deb defaults)
#
# Tag layout (consistent with sudhanix-core):
#   vajra            — everything in this role
#   vajra-install    — apt install vajra + cleanup of legacy zipapp install
#   vajra-config     — drop-in dir + /etc/vajra/*.json
#   install / config — universal cross-role tags

# ---------- shared: drop-in dir + /etc/vajra ---------- #

- name: ensure vajra runtime dirs
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /usr/local/lib/vajra
    - /usr/local/lib/vajra/tools
    - /etc/vajra
  tags:
    - vajra
    - vajra-install
    - vajra-config
    - install
    - config

# ---------- install path ---------- #

- name: install vajra (from apt.cttb extras)
  apt:
    name: vajra
    state: latest
    update_cache: yes
    cache_valid_time: 3600
  tags:
    - vajra
    - vajra-install
    - install

- name: remove legacy zipapp install (pre-deb layout)
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/vajra
    - /usr/local/bin/vajra-test
    - /usr/local/lib/vajra/lib
    - /usr/local/lib/vajra/tests
  tags:
    - vajra
    - vajra-install
    - install

# ---------- testing tools ---------- #
# Drop-in Lua tools that exercise the local PAM/welcome/LDAP stack from
# the GUI. Counterpart to utils/run-pam-test (cttb-ansible#3) for IT staff
# at the seat. See monogarden#7 for design notes; depends on monogarden#2
# (Vajra LDAP TLS) for the LDAP-write paths.
- name: deploy Vajra Testing-category tools
  copy:
    src: "tools/{{ item }}"
    dest: "/usr/local/lib/vajra/tools/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - test_pam_auth.lua
    - test_token_state.lua
    - test_welcome_preview.lua
    - test_ldap_dismissal.lua
  tags:
    - vajra
    - vajra-config
    - vajra-testing
    - config

# theme.lua is bundled in the next vajra release (BUNDLED in src/loader.rs);
# until that .deb ships, deploy as a runtime drop-in so the tool shows up
# in the sidebar today. Idempotent — when the bundled version takes over
# the drop-in path is harmless (loader prefers BUNDLED on collision; remove
# this task once the .deb ships).
- name: deploy theme tool (drop-in pre-bundle)
  copy:
    src: "tools/theme.lua"
    dest: "/usr/local/lib/vajra/tools/theme.lua"
    owner: root
    group: root
    mode: '0644'
  tags:
    - vajra
    - vajra-config
    - config

# ---------- config path ---------- #

- name: deploy host-overridable configs (override .deb defaults)
  copy:
    content: "{{ item.content | to_nice_json(indent=2) }}\n"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - dest: /etc/vajra/quick-links.json
      content: "{{ vajra_quick_links }}"
    - dest: /etc/vajra/ldap.json
      content:
        uri:       "{{ vajra_ldap_uri }}"
        base_dn:   "{{ vajra_ldap_base_dn }}"
        people_ou: "{{ vajra_ldap_people_ou }}"
        group_ou:  "{{ vajra_ldap_group_ou }}"
    - dest: /etc/vajra/sudhanix.json
      content:
        it_email: "{{ vajra_it_email }}"
  loop_control:
    label: "{{ item.dest }}"
  tags:
    - vajra
    - vajra-config
    - config
