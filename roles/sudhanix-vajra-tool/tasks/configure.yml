---
# sudhanix-vajra-tool — configure phase.
#
# CTTB-coupled Lua tool drop-ins (kept out of the upstream .deb so the
# package stays portable), plus host-overridable JSON configs that
# override the .deb-shipped defaults.

# Vajra bundles generic sysadmin tools (network_diag, password_reset,
# ldap_debug, etc). Anything hard-coded to a CTTB-only path (sudhanix-welcome
# binary, sudhanixWelcomeDismissed LDAP attr, /run/sudhanix-tokens/,
# /usr/local/sbin/sudhanix-firstlogin, the welcome-panel test runners) lives
# in THIS role and deploys as a runtime drop-in under
# /usr/local/lib/vajra/tools/. Vajra's bundled set stays free of Sudhanix
# responsibilities — if generic-sounding tool code in the bundle starts
# referencing CTTB paths, move it here.
#
# Tool file format: new self-bound API. `local TOOL = {}; function
# TOOL:action_X(fields) ... self:run(...) ... end; ... registry.register(TOOL)`.
# See vajra-engine/src/tools/ldap_debug.lua for the canonical shape.
- name: deploy Sudhanix-specific Vajra tools
  copy:
    src: "tools/{{ item }}"
    dest: "/usr/local/lib/vajra/tools/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    # Sudhanix-coupled tools migrated out of bundled vajra. The bundle no
    # longer ships these so the role is now the single source of truth.
    - sudhanix.lua          # campus desktop status, launchers, set-hostname
    - welcome_reset.lua     # clear sudhanixWelcomeDismissed LDAP flag
    - xfce_reset.lua        # quarantine XFCE config + re-run firstlogin
    # IT-only test runners for PAM / welcome / LDAP / plank DBus.
    # See monogarden#7 for design notes; depends on the LDAP TLS fix in
    # monogarden#2 for the LDAP-write paths.
    - test_pam_auth.lua
    - test_token_state.lua
    - test_welcome_preview.lua
    - test_ldap_dismissal.lua
    - test_plank_dbus.lua
  tags:
    - vajra
    - vajra-config
    - vajra-sudhanix
    - vajra-testing
    - config

- name: deploy host-overridable configs (override .deb defaults)
  copy:
    content: "{{ item.content | to_nice_json(indent=2) }}\n"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - dest: /etc/vajra/quick-links.json
      content: "{{ vajra_quick_links }}"
    - dest: /etc/vajra/ldap.json
      content:
        uri:       "{{ vajra_ldap_uri }}"
        base_dn:   "{{ vajra_ldap_base_dn }}"
        people_ou: "{{ vajra_ldap_people_ou }}"
        group_ou:  "{{ vajra_ldap_group_ou }}"
    - dest: /etc/vajra/sudhanix.json
      content:
        it_email: "{{ vajra_it_email }}"
  loop_control:
    label: "{{ item.dest }}"
  tags:
    - vajra
    - vajra-config
    - config
