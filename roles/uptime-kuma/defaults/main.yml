---
# gh-84: Uptime Kuma — single self-hosted up/down monitor on srv-vm,
# replacement for the decommissioned mon/metrics (gh-30).
uptime_kuma_image: louislam/uptime-kuma:1
uptime_kuma_data_dir: /srv/uptime-kuma/data
uptime_kuma_port: 3001
uptime_kuma_runtime: podman          # podman quadlet (no daemon); 'docker' also supported by tasks
uptime_kuma_admin_url: "uptime-kuma.cttb"
uptime_kuma_status_url: "status.cttb"
# Primary alert target (operator). Webhook/chat target added when one exists.
uptime_kuma_alert_email: "john.chandara@icloud.com"
# Backup: nightly export of the monitor config.
uptime_kuma_backup_dir: "/srv/storehouse/backups/uptime-kuma"
