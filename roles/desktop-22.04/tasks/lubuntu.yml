---

  - name: install ubuntu desktop minimal
    apt:
      state: present
      install_recommends: no
      name:
      - ubuntu-desktop-minimal
    tags:
      - packages
      - lubuntu

  - name: install desktop theme packages
    apt:
      state: present
      name:
      - breeze-gtk-theme
      - breeze-icon-theme
      - papirus-icon-theme
    tags:
      - packages
      - desktop

  - name: install lubuntu
    apt:
      state: present
      install_recommends: no
      name:
      - alsa-utils
      - alsamixergui
      - desktop-file-utils
      - dmz-cursor-theme
      - evince
      - file-roller
      #- galculator    # Unneeded in 20.04, has gnome-calculator.
      - gedit          # 20.04 Ubuntu-desktop-minimal in mini.iso did not include these 4 pkgs: gedit, gnome-calculator/characters/system-monitor.
      - gnome-calculator
      - gnome-characters
      - gnome-system-monitor
      - gnome-system-tools
      - indicator-application
      #- leafpad       # Absent in 20.04.
      - libpolkit-agent-1-0
      #- libpolkit-backend-1-0
      - libpolkit-gobject-1-0
      #- libpolkit-qt-1-1
      - libpolkit-qt5-1-1
      - lightdm-gtk-greeter-settings
      - light-locker
      - light-locker-settings
      - lubuntu-artwork
      #- lubuntu-core   # Absent in 20.04.
      #- lubuntu-default-session   # Absent in 20.04.
      - lubuntu-default-settings
      #- lubuntu-lxpanel-icons     # Absent in 20.04.
      - lxappearance
      - lxappearance-obconf
      - lximage-qt          # For 20.04.
      - lxinput
      - lxlauncher
      #- lxpanel-indicator-applet-plugin   # Absent in 20.04.
      - lxqt-config   # Added for 20.04.
      - lxqt-globalkeys   # Added for 20.04.
      - lxqt-panel    # Added for 20.04.
      - lxqt-powermanagement    # Added for 20.04 to allow no idleness checker/screen always on, Rui 2023-09-21, requested by BS stud Jason Chiem.
      - lxrandr
      - lxsession-default-apps
      - lxsession-logout
      #- lxshortcut   # Absent in 20.04.
      #- lxtask   # Unneeded.
      - lxterminal
      - network-manager
      - network-manager-gnome
      - obconf
      - pcmanfm-qt   # Added for 20.04.
      #- plymouth-theme-lubuntu-logo
      #- plymouth-theme-lubuntu-text
      - pm-utils
      - policykit-1
      - policykit-1-gnome
      - xscreensaver    # Added for 20.04 to allow no idleness checker/screen always on, Rui 2023-09-21, requested by BS stud Jason Chiem.
      - scrot
      - simple-scan
      - system-tools-backends
      - xdg-user-dirs
      - xfce4-power-manager
      - xz-utils
    tags:
      - packages
      - lubuntu

  # overrides lubuntu default triggering the LXDE session to be loaded which
  # in turns make lxde pick up the wrong configs.
  - name: remove lxde-common
    apt:
      name: lxde-common
      state: absent
    tags:
      - packages
      - lubuntu

  # Remove unneeded lubuntu pkgs.
  - name: remove unneeded lubuntu pkgs
    apt:
      state: absent
      name:
      - galculator
      - galternatives
      - gnome-disk-utility
      - gnome-font-viewer
      - qlipper
    tags:
      - packages
      - lubuntu

  # Did not exist in Lubuntu 20.04.
  - name: create /usr/share/lubuntu/images/ if it does not exist
    file:
      path: /usr/share/lubuntu/images
      state: directory
      mode: '0755'
    tags:
      - lubuntu
