---

# Because Vbox ppa doesn't provide the same pkg names as mainstream, we need to
# remove those packages and install the one from ppa that has the version
# appended to it
- name: add virtualbox repo key
  apt_key:
    url: https://www.virtualbox.org/download/oracle_vbox_2016.asc
    state: present

- name: add ansible repo mirror
  apt_repository:
    repo: "deb {{deb_mirror}}/virtualbox xenial contrib"
    state: present

- name: remove old virtbualbox pkgs
  apt:
    name: "{{item}}"
    state: absent
  with_items:
    - virtualbox
    - virtualbox-guest-additions-iso
    - virtualbox-guest-utils
    - virtualbox-guest-x11

- name: install virtbualbox 5.1
  apt:
    name: virtualbox-5.1
    state: latest

# maybe this still manual for now
- name: install virtualbox extensions
  debug:
    msg: remember to install the vbox extensions if you want USB support and pxe
