---

  - name: install qemu-kvm packages
    apt:
      name: "{{item}}"
      state: latest
      install_recommends: no
    with_items:
      - ipxe-qemu
      - qemu-block-extra:amd64
      - qemu-kvm
      - qemu-system-common
      - qemu-system-x86
      - qemu-utils

  - name: install supporting packages
    apt:
      name: "{{item}}"
      state: latest
      install_recommends: no
    with_items:
      - socat # to send signal to qemu for instance shutdown

  - name: make qemuhelper setuid
    file:
      path: /usr/lib/qemu/qemu-bridge-helper
      mode: 04755

  - name: create dir for qemu bridge config
    file:
      path: /etc/qemu
      state: directory
      mode: 0755

  - name: create qemu bridge config file
    copy:
      content: "allow {{qemu_bridge}}"
      dest: /etc/qemu/bridge.conf
      mode: 0644
      owner: root
      group: root
 
  - name: create qemu user
    user:
      name: qemu
      createhome: no
      comment: "Qemu KVM User"
      uid: 126
      group: kvm
      groups: disk
      home: "{{qemu_dir}}"
      shell: /bin/bash

  - name: set permissions on homedir for qemu
    file:
      path: "{{qemu_dir}}"
      state: directory
      mode: 0755
      owner: qemu
      group: kvm

  # create all the necessary for all defined VMs
  # NB: fs are not actually created by ansible
  - block:

    - name: create dir for VM
      file:
        path: "{{qemu_dir}}/{{item.name}}"
        state: directory
        owner: qemu
        group: kvm
        mode: 0755
      with_items: "{{qemu_vms}}"

    - name: deploy VM start script
      template:
        src: qemu.sh.j2
        dest: "{{qemu_dir}}/{{item.name}}/start"
        mode: 0750
        owner: qemu
        group: kvm
      with_items: "{{qemu_vms}}"
      tags:
        - kvm_script

    - name: deploy VM reboot script
      template:
        src: restart.j2
        dest: "{{qemu_dir}}/{{item.name}}/restart"
        mode: 0750
        owner: qemu
        group: kvm
      with_items: "{{qemu_vms}}"
      tags:
        - kvm_script

    - name: deploy VM stop script
      template:
        src: stop.j2
        dest: "{{qemu_dir}}/{{item.name}}/stop"
        mode: 0750
        owner: qemu
        group: kvm
      with_items: "{{qemu_vms}}"
      tags:
        - kvm_script

    when: qemu_vms is defined
