;=========== LIP-68XX configuration information SIP4B(v1.0) ===================
; copyright LG-Nortel 2006
;==============================================================================
;
; This file can be used as a global configuration file for all LIP-6800 series
; phones (LIP-6804, LIP-6812& LIP_6830) and as a phone-specific configuration
; file. The Global file defines characteristics common to all the phones using
; the sysconf_68??d_sip.cfg file name (??= 04, 12, or 30). Phone-specific
; parameters are defined in the MAC file; use the phone’s MAC address as the file
; name with no extension.
;
;------------------------------Description for configuration file--------------------------------
;
; The configuration file uses the following format
;
; [SECTION NAME]
; Field name value
;
; Make sure there is a space character after the value and before the “;” comments.
; To enter a space character, wrap the entire string in double quotes (“).
; The Configuration file returns the LIP Phone to default when the field is
; left blank. If the default is desired, it is recommended no value be assigned
; for the field in the Config file.
; A Field may be deleted or commented-out from the Config file to use the LIP Phones existing memory.
;
; ---------------------- SETTINGS -----------------------------------------------------------
; Assure the field/parameter settings are configured to match up with the use of the phone.
;
; The below file is set-up for the 2 lines, which is default, add lines for the specific configuration.
; -----------------------------------------------------------------------------------------------
;
[LAN]
;Lan configuration
;
network_mode dhcp
dns1_address 8.8.8.8
dns2_address 9.9.9.9
domain_name
tftp_server_address 10.11.6.1
tos
pc_802_priority
phone_802_priority
pc_vlan_id
phone_vlan_id
;
[VOIP]
;VoIP configurations
outbound_proxy_server 10.11.6.1
outbound_proxy_port 5060
backup_proxy_server
backup_proxy_port
SIP_service_domain
preferred_codec
rtp_port
outbound_proxy_register enable
prack_mode
user_param
replaces_mode
local_udp_port
message_url
timer_register_expires
timer_session
timer_t1
timer_t2
stun_server
centralized_conference
conference_url
de_register
max_line_num
;
[ROUTE]
;Call Routing Table Configurations
;add intf <port> nums [trunc pre
;
;
[DSP]
;DSP configurations
ringer_off
VAD
dtmf_payload
dtmf_duration
frame_duration
headset_mode
dtmf
ringtype0
ringtype1
ringtype2
ringtype3
ringtype4
ringtype5
ringtype6
cadence0
cadence1
cadence2
cadence3
cadence4
cadence5
jitterbuffer_min_delay
jitterbuffer_nom_delay
jitterbuffer_max_delay
;
[FWRD]
;Forwarding Configurations
condition
forwarding_address
noanswer_time
;
;
[DIAL]
;Dial Configurations
dial_mode
pause_timer
inter_digit_timer
dialplan
digitmap
digitmap_tone
digitmap_process
;
[PROG]
;add prog func [num]
;Entries for programmable buttons. Type the word “add” followed by space, the
;button number, space, function number and for speed dials the number to dial.
;For message function enter the url, ip address or telephone number for voice
;mail.
;
; prog = programmable button number, 6804N:3~4, 6812D:3~11, 6830D:3~2
; func = 0 for no function
; 1 for Speed Dial
; 2 for Phone Book
; 3 for Call Log
; 4 for Mute
; 5 for Headset
; 6 for Redial
; 7 for Return
; 8 for FWRD
; 9 for CONF
; 10 for TRNS
; 11 for Hold
; 12 for DND
; 13 Ringer Off
; 14 Message
; 15 ACD Agent
; 16 Intercom
;
; [num] =
; Speed Dial phone number or Vmail contact, max.50 character string.
;
;
[CALL]
;Call Preference Configurations
caller_id_blk
anonymous_call_blk
call_waiting
call_waiting_tone
call_hold_ringback
msg_waiting_tone
auto_answer
intercom_noti
acd_active
acd_primary_line
acd_unavail_completed
acd_unavail_missed
acd_unavail_time_completed
call_direct
call_direct_number
call_direct_timer
;
;
[SNMP]
;SNMP configurations
snmp_function
snmp_manager_address
snmp_read_community
snmp_write_community
;
;
[SYSTEM]
;System configurations
lang
lock_outgoing_call
use_speed_number
web_server 1
telnet_server 1
function call_park
function call_pickup
function group_call_pickup
function direct_call_pickup
function cdp
phone_password
;
[PROVISION]
;provisioning selections
type 0
dhcp_get_tftp enable
https_url
https_opt
dhcp_get_http
https_port
https_id
https_password
https_macform
verifying_cert
smartup_use
smartup_type
smartup_interval
smartup_time
smartup_confirm
decrypt_key
cfg_download enable
sw_download disable
;
[NETTIME]
;SNTP, Timezone and DST Configurations
sntp_server_address pool.ntp.org
interval 24
timezone 3
dst_auto_adjust on
dst_start_month 3
dst_start_day 0
dst_start_day_of_week 1
dst_start_week_of_month 2
dst_start_time 2
dst_stop_month 11
dst_stop_day 0
dst_stop_day_of_week 1
dst_stop_week_of_month 1
dst_stop_time 2
time_format 2
;
;===============================================================================
