; CTTB Phone System
; Admin: spike@drba.org

[from-internal-drbu]

exten => _NXXNXXXXXX,1,goto(${CONTEXT},1${EXTEN},1)
exten => _1NXXNXXXXXX,1,Set(CALLERID(all)= "Dharma Realm Buddhist University" <707-621-7000>)
 same => n,Dial(SIP/${EXTEN}@vitel-outbound)
 same => n,Hangup()

; e911 must be enabled. see DIDs > NPANXXNXXX > Action menu > e911
exten => _911,1,Dial(SIP/911@vitel-outbound)

;;;; DRBU special aliases

; Office of Admissions and Financial Aid
exten => 4360,1,Goto(from-internal-drbu,4200,1)
; Kristine Go (no phone)
exten => 4570,1,Goto(from-internal-drbu,5103887718,1)
; Heng Liang always want calls to her cell
exten => 4301,1,Goto(from-internal-drbu,7072468622,1)

; Angela Justice special redirect phone weekends
exten => 4851,1,GotoIfTime(*,mon-thu,*,*?oncampus:away)
 same => n(oncampus),Goto(from-internal-drbu,4851,1)
 same => n(away),Goto(from-internal-drbu,5107767146,1)
 same => n,Hangup()

include => from-internal-cttb

[drbu-main-menu]
; sounds are in /usr/share/asterisk/sounds/recordings

exten => s,1,Verbose(1, Caller ${CALLERID(all)} has entered the auto attendant)
 same => n,Answer()

; this sets the inter-digit timer
 same => n,Set(TIMEOUT(digit)=5)

; wait one second to establish audio
 same => n,Wait(1)

; If Mon-Fri 9-5 goto label daygreeting
; same => n,GotoIfTime(9:00-17:00,mon-fri,*,*?daygreeting:afterhoursgreeting)

; same => n(afterhoursgreeting),Background(recordings/drbu-afterhours) ; AFTER HOURS GREETING
; same => n,Goto(menuprompt)

; same => n(daygreeting),Background(recordings/drbu-daytime)   ; DAY GREETING
; same => n,Goto(menuprompt)

 same => n(menuprompt),Background(recordings/drbu-ar-res) ; MAIN MENU PROMPT
 same => n,WaitExten(4)                      ; more than 4 seconds is probably
                                             ; too much
 same => n,Goto(0,1)                         ; Treat as if caller has pressed '0'

