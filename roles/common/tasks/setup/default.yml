---

- name: disable needrestart interactive prompts
  copy:
    src: conf/needrestart-auto.conf
    dest: /etc/needrestart/conf.d/50-autorestart.conf
    mode: 0644
    owner: root
    group: root
  ignore_errors: yes
  tags:
    - apt
    - needrestart

- name: custom apt sources (deb822 format, Ubuntu 24.04+)
  template:
    src: ubuntu.sources.j2
    dest: /etc/apt/sources.list.d/ubuntu.sources
    mode: 0644
    owner: root
    group: root
  when: ansible_distribution_major_version | int >= 24
  tags:
    - apt

- name: remove legacy sources.list on Ubuntu 24.04+
  copy:
    content: "# Managed by Ansible — see /etc/apt/sources.list.d/ubuntu.sources\n"
    dest: /etc/apt/sources.list
    mode: 0644
    owner: root
    group: root
  when: ansible_distribution_major_version | int >= 24
  tags:
    - apt

- name: custom apt sources.list (legacy format, pre-24.04)
  template:
    src: sources.list.j2
    dest: /etc/apt/sources.list
    mode: 0644
    owner: root
    group: root
  when: ansible_distribution_major_version | int < 24
  tags:
    - apt

- name: add additional apt repo
  apt_repository:
    repo: "{{ item }}"
    state: present
  loop: "{{ additional_apt_repo }}"
  when: additional_apt_repo is defined
  tags:
    - apt
    - additional_apt_repo

- name: refresh the mirrors
  apt:
    update_cache: yes
  ignore_errors: True
  tags:
    - apt
    - apt_autoremove

# in case for whatever reason this is missing, it's useful to add ppas to test stuff
- name: install apt-add-repository
  apt:
    name: software-properties-common
    state: present
  tags:
    - apt

# setup during preseed stage, but just in case, make sure it's there
- name: Set up ansible/cttb-os authorized_key
  authorized_key:
    user: administrator
    key: "{{ lookup('file', 'ssh_keys/ansible.pub') }}"

- name: Set up jc authorized_key
  authorized_key:
    user: administrator
    key: "{{ lookup('file', 'ssh_keys/jc.pub') }}"

- name: set an explicit proxy if needed
  lineinfile:
    dest: /etc/environment
    line: "{{ item }}"
  loop: "{{ global_proxy }}"
  when: global_proxy is defined
  tags:
    - common_proxy

- name: sync time
  include_role:
    name: time-server

- name: install CTTB CA cert
  include_role:
    name: cttb-ca-client

- name: set hostname from inventory
  hostname:
    name: "{{ inventory_hostname }}"

- name: fix /etc/hosts
  replace:
    dest: /etc/hosts
    regexp: "computer"
    replace: "{{ inventory_hostname }}"
    backup: no

- name: make ssh use ipv4 only # we disable ipv6 and X11forwarding fails
  lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: '^AddressFamily inet'
    # Insert the line before "ListenAddress" or "#ListenAddress" lines.
    insertbefore: '^.?ListenAddress'
    line: 'AddressFamily inet'
  tags:
    disable_ipv6
  notify:
    - reload ssh
  ignore_errors: yes

- name: enable centralized logging
  copy:
    src: conf/10-centralized-logging.conf
    dest: /etc/rsyslog.d/10-centralized-logging.conf
    mode: 0644
    owner: root
    group: root
  when: centralized_logging == true
  notify:
    - restart rsyslog
  tags:
    - logging

- name: ensure NetworkManager conf.d directory exists
  file:
    path: /etc/NetworkManager/conf.d
    state: directory
    mode: 0755
    owner: root
    group: root
  tags:
    - wake_on_lan

- name: enable Wake On LAN on Ethernet interfaces
  copy:
    src: conf/ethernet-wake-on-lan.conf
    dest: /etc/NetworkManager/conf.d/ethernet-wake-on-lan.conf
    mode: 0644
    owner: root
    group: root
  tags:
    - wake_on_lan

- name: upgrade ansible to latest
  apt:
    name: ansible
    state: latest
  tags:
    - apt

- name: remove some software
  apt:
    state: absent
    name:
      - popularity-contest
      - nano
      - avahi-daemon
  tags:
    - remove_sw

- name: remove sw requested for this box
  apt:
    name: "{{ remove_sw }}"
    state: absent
  when: remove_sw is defined
  tags:
    - remove_sw

# exfat-fuse and exfat-utils are for support of exfat file system, FAT with total fs size > 4 GB.
- name: install basic software
  apt:
    state: present
    install_recommends: no
    name:
      - curl
      - ethtool
      - exfat-fuse
      - exfatprogs
      - fio
      - fish
      - git
      - iftop
      - iotop
      - iperf
      - iptraf-ng
      - mtr
      - neovim
      - nload
      - p11-kit-modules
      - quota
      - smartmontools
      - socat
      - tcpdump
      - traceroute
      - udisks2
      - unattended-upgrades
      - util-linux
      - vim
      - wakeonlan
      - whois
  tags:
    - basic_software

- name: install version-specific extra software
  apt:
    name: "{{ common_extra_install_sw | default([]) }}"
    state: present
    install_recommends: no
  tags:
    - basic_software

- name: install sw requested for this box
  apt:
    name: "{{ additional_sw | default([]) }}"
    state: present
  tags:
    - additional_sw

- name: disable ipv6 #defaults to yes
  copy:
    src: conf/disable-ipv6.conf
    dest: /etc/sysctl.d/60-disable-ipv6.conf
    mode: 0644
    owner: root
    group: root
  when: disable_ipv6
  tags:
    - disable_ipv6

# Add history search using the first few characters.
- name: account default .bashrc
  copy:
    src: conf/bashrc
    dest: /etc/skel/.bashrc
    mode: 0644
    owner: root
    group: root

- name: vim saner defaults
  copy:
    src: conf/vimrc
    dest: /etc/skel/.vimrc
    mode: 0644
    owner: root
    group: root

# administrator account has already been created so the above won't take effect
- name: customize settings for administrator -- .bashrc, .vimrc
  copy:
    src: '{{ item.src }}'
    dest: '{{ item.dest }}'
    remote_src: yes
    mode: 0644
    owner: administrator
    group: administrator
  loop:
    - { src: '/etc/skel/.bashrc', dest: '/home/administrator/' }
    - { src: '/etc/skel/.vimrc', dest: '/home/administrator/' }
  tags:
    - administrator

- name: dist-upgrade + autoremove purge
  apt:
    autoremove: yes
    purge: yes
    upgrade: dist
  tags:
    - apt

- name: apt autoremove
  command: /usr/bin/apt-get autoremove -y
  tags:
    - apt
    - apt_autoremove

  # Defined in group_vars, default is en_US.UTF-8.
- name: set the system locale
  command: /usr/sbin/update-locale LANG={{ locale }} LANGUAGE
  changed_when: false
  tags:
    - locale
