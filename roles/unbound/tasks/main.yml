---

  # setup unbound
  - name: install unbound
    apt:
      name: unbound
      state: present

  - name: install unbound python support
    apt:
      name: python-unbound
      state: present

  # setup logfile unbound
  - name: setup unbound log dir
    file:
      path: /var/log/unbound/
      state: directory
      owner: unbound
      group: adm
      mode: 0775
    tags:
      - logging

  - name: setup unbound.log
    copy:
      content: ''
      dest: /var/log/unbound/unbound.log
      owner: unbound
      group: adm
      mode: 0660
      force: no
    tags:
      - logging

  - name: setup unbound logging
    copy:
      src: rsyslog-30-unbound.conf
      dest: /etc/rsyslog.d/30-unbound.conf
      mode: 0644
      owner: root
      group: root
      force: yes
    notify:
    - restart rsyslog
    tags:
      - logging

  - name: deploy unbound /etc/default/ settings
    copy:
      src: etc-default
      dest: /etc/default/unbound
      mode: 0640
      owner: root
      group: root
      force: yes
    notify:
    - restart unbound
    tags:
      - config

  - name: deploy unbound config
    copy:
      src: unbound.conf
      dest: /etc/unbound/unbound.conf.d/unbound.conf
      mode: 0640
      owner: root
      group: unbound
      force: yes
    notify:
    - restart unbound
    tags:
      - config

  - name: setup unbound blacklist dir
    file:
      path: /etc/unbound/unbound.conf.d/blocked-sites/
      state: directory
      owner: root
      group: unbound
      mode: 0750
    tags:
      - blacklist

  - name: deploy blacklists
    copy:
      src: blocked-sites/{{item}}
      dest: /etc/unbound/unbound.conf.d/blocked-sites/
      mode: 0640
      owner: root
      group: unbound
      force: yes
    with_items: "{{ ub_blocked_sites | union(ub_blocked_sites_extra)}}"
    notify:
    - restart unbound
    tags:
      - blacklist

  # gh-47: cttb. zone duplication. unbound.conf ALREADY ships
  # `forward-zone: name: "cttb." forward-addr: 10.11.1.19` (dnsmasq) but
  # ALSO includes this zone_cttb local-data copy — and Unbound local-data
  # takes precedence over forward-zone, so the var-driven copy shadows
  # dnsmasq and a campus A-record must be edited in TWO places.
  #
  # Option A (issue's "lowest churn"; dnsmasq stays authoritative): set
  # `unbound_cttb_single_source: true` and Unbound stops carrying its own
  # copy — the pre-existing forward-zone resolves all cttb. names, one
  # source of truth. Default FALSE preserves current behaviour byte-for-
  # byte until the operator picks the direction and verifies on the live
  # dns.cttb resolver (production DNS — never auto-flipped).
  - name: deploy cttb local zone (legacy dual-source — default)
    template:
      src: zone_cttb.j2
      dest: /etc/unbound/unbound.conf.d/cttb
      mode: 0640
      owner: root
      group: unbound
      force: yes
    when: not (unbound_cttb_single_source | default(false) | bool)
    notify:
    - restart unbound
    tags:
      - zone_cttb

  - name: gh-47 single-source — drop Unbound's cttb local-data copy (forward-zone → dnsmasq only)
    file:
      path: /etc/unbound/unbound.conf.d/cttb
      state: absent
    when: unbound_cttb_single_source | default(false) | bool
    notify:
    - restart unbound
    tags:
      - zone_cttb

    #  - name: disable dnssec
    #command: creates="/etc/unbound/unbound.conf.d/root-auto-trust-anchor-file.conf.disabled" mv /etc/unbound/unbound.conf.d/root-auto-trust-anchor-file.conf /etc/unbound/unbound.conf.d/root-auto-trust-anchor-file.conf.disabled
    #notify:
      #- restart unbound

  - name: setup root hints
    copy:
      src: named.cache
      dest: /etc/unbound/named.cache
      mode: 0640
      owner: root
      group: unbound
      force: yes
    notify:
    - restart unbound

  - name: deploy resgen.py
    copy:
      src: resgen-{{ub_class}}.py
      dest: /etc/unbound/resgen.py
      mode: 0640
      owner: root
      group: unbound
      force: yes
    notify:
    - restart unbound
    tags:
      - blacklist

  # setup logrotate unbound. Run it manually at midnight instead than as part
  # of logrotate with cron.daily. This helps DM Gong with other work on log
  # correlation
  - name: make sure old logrotate is gone
    file:
      path: /etc/logrotate.d/unbound
      state: absent

  - name: logrotate unbound config
    copy:
      src: logrotate-unbound
      dest: /etc/unbound/logrotate.conf
      mode: 0640
      owner: root
      group: root

  - name: rotate logs at midnight
    copy:
      src: unbound-crond
      dest: /etc/cron.d/unbound-log
      mode: 0750
      owner: root
      group: root

  - name: enable unbound service
    service:
      name: unbound
      enabled: yes

  - name: ensure unbound is running
    service:
      name: unbound
      state: started
