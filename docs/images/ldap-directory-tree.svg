<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <!-- Background -->
  
  
  <!-- Title -->
  <text x="400" y="40" font-family="Inter Display, sans-serif" font-size="24" font-weight="bold" fill="#1e293b" text-anchor="middle">CTTB LDAP Directory Tree (DIT) Structure</text>

  <!-- Root -->
  <rect x="300" y="80" width="200" height="60" rx="10" fill="#f1f5f9" stroke="#00b4d8" stroke-width="2" />
  <text x="400" y="115" font-family="Inter Display, sans-serif" font-size="16" font-weight="bold" fill="#00b4d8" text-anchor="middle">dc=cttb</text>

  <!-- Branches -->
  <!-- 1. People -->
  <rect x="50" y="200" width="180" height="60" rx="5" fill="#301808" stroke="#fb923c" stroke-width="1" />
  <text x="140" y="235" font-family="Inter Display, sans-serif" font-size="14" font-weight="bold" fill="#fb923c" text-anchor="middle">ou=People</text>
  
  <!-- 2. Group -->
  <rect x="310" y="200" width="180" height="60" rx="5" fill="#083020" stroke="#34d399" stroke-width="1" />
  <text x="400" y="235" font-family="Inter Display, sans-serif" font-size="14" font-weight="bold" fill="#34d399" text-anchor="middle">ou=Group</text>

  <!-- 3. Config (cn=config) -->
  <rect x="570" y="200" width="180" height="60" rx="5" fill="#300820" stroke="#f472b6" stroke-width="1" />
  <text x="660" y="235" font-family="Inter Display, sans-serif" font-size="14" font-weight="bold" fill="#f472b6" text-anchor="middle">cn=config</text>

  <!-- Leaf Nodes -->
  <!-- People entries -->
  <rect x="50" y="300" width="180" height="100" rx="5" fill="#1a1f2e" stroke="#64748b" stroke-width="1" />
  <text x="60" y="325" font-family="Inter Display, sans-serif" font-size="10" fill="#475569">uid=namo.amituofo</text>
  <text x="60" y="345" font-family="Inter Display, sans-serif" font-size="10" fill="#475569">uid=frank.liu</text>
  <text x="60" y="365" font-family="Inter Display, sans-serif" font-size="10" fill="#fb923c">sudhanixUser (Aux)</text>

  <!-- Group entries -->
  <rect x="310" y="300" width="180" height="100" rx="5" fill="#1a1f2e" stroke="#64748b" stroke-width="1" />
  <text x="320" y="325" font-family="Inter Display, sans-serif" font-size="10" fill="#475569">cn=it (2001)</text>
  <text x="320" y="345" font-family="Inter Display, sans-serif" font-size="10" fill="#475569">cn=drbu-students (2002)</text>
  <text x="320" y="365" font-family="Inter Display, sans-serif" font-size="10" fill="#475569">cn=dvgs-students (2006)</text>

  <!-- Config entries -->
  <rect x="570" y="300" width="180" height="100" rx="5" fill="#1a1f2e" stroke="#64748b" stroke-width="1" />
  <text x="580" y="325" font-family="Inter Display, sans-serif" font-size="10" fill="#475569">cn=schema,cn=config</text>
  <text x="590" y="345" font-family="Inter Display, sans-serif" font-size="9" fill="#f472b6">cn=sudhanix (custom)</text>
  <text x="580" y="375" font-family="Inter Display, sans-serif" font-size="10" fill="#475569">olcDatabase={1}mdb</text>

  <!-- Connections -->
  <path d="M 400 140 L 400 200" stroke="#00b4d8" stroke-width="2" fill="none" />
  <path d="M 400 170 L 140 170 L 140 200" stroke="#00b4d8" stroke-width="2" fill="none" />
  <path d="M 400 170 L 660 170 L 660 200" stroke="#00b4d8" stroke-width="2" fill="none" />

  <path d="M 140 260 L 140 300" stroke="#fb923c" stroke-width="2" fill="none" />
  <path d="M 400 260 L 400 300" stroke="#34d399" stroke-width="2" fill="none" />
  <path d="M 660 260 L 660 300" stroke="#f472b6" stroke-width="2" fill="none" />

</svg>
