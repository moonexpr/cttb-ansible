<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  
  <text x="20" y="30" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="16" font-weight="bold" fill="#991b1b">CTTB IT Support Tiers</text>
  
  <!-- Tier 0 -->
  <rect x="50" y="60" width="700" height="60" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="70" y="95" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">Tier 0: Self-Help (Documentation)</text>
  <text x="70" y="110" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="10" fill="#dc2626">Wiki Guides, Common Task Recipes, Release Notes</text>
  
  <!-- Tier 1 -->
  <rect x="100" y="140" width="600" height="60" rx="8" fill="#fecaca" stroke="#f87171" stroke-width="2"/>
  <text x="120" y="175" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">Tier 1: School Coordinator</text>
  <text x="120" y="190" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="10" fill="#dc2626">Password Resets, Local Hardware, Basic Connectivity</text>
  
  <!-- Tier 2 -->
  <rect x="150" y="220" width="500" height="60" rx="8" fill="#fca5a5" stroke="#fb7185" stroke-width="2"/>
  <text x="170" y="255" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">Tier 2: IT Core Team</text>
  <text x="170" y="270" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="10" fill="#dc2626">Server Issues, Network Outages, Bug Reports</text>
  
  <!-- Tier 3 -->
  <rect x="200" y="300" width="400" height="60" rx="8" fill="#f87171" stroke="#ef4444" stroke-width="2"/>
  <text x="220" y="335" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Tier 3: The Overseer (System Lead)</text>
  <text x="220" y="350" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="10" fill="#ffe4e6">Architectural Changes, Security Policy, High-Level Strategy</text>
</svg>