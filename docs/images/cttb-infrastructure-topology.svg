<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  
  
  <!-- Physical Hosts -->
  <rect x="50" y="50" width="700" height="500" rx="10" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="60" y="70" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="16" font-weight="bold" fill="#475569">CTTB Core Physical Network</text>
  
  <!-- srv-vm -->
  <rect x="100" y="100" width="250" height="350" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="110" y="125" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="14" font-weight="bold" fill="#1e40af">srv-vm (Primary LXD)</text>
  <text x="110" y="145" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="12" fill="#1e40af">Ubuntu 16.04</text>
  
  <!-- Containers srv-vm -->
  <rect x="115" y="160" width="220" height="270" rx="5" fill="#eff6ff" stroke="#60a5fa" stroke-width="1"/>
  <text x="125" y="180" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="10" fill="#3b82f6">LXC: ldap (Identities)</text>
  <text x="125" y="195" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="10" fill="#3b82f6">LXC: dnsmasq (DHCP/DNS)</text>
  <text x="125" y="210" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="10" fill="#3b82f6">LXC: asterisk (VoIP)</text>
  <text x="125" y="225" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="10" fill="#3b82f6">LXC: cups-cttb/dvgs/dvbs</text>
  <text x="125" y="240" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="10" fill="#3b82f6">LXC: wiki-2404 (Knowledge)</text>
  <text x="125" y="255" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="10" fill="#3b82f6">LXC: blogger / drbu-sis</text>
  <text x="125" y="270" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="10" fill="#3b82f6">LXC: ub-adult / ub-igdvs</text>
  <text x="125" y="285" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="10" fill="#3b82f6">LXC: jumpbox / sltp / mon</text>
  
  <!-- srv-nas -->
  <rect x="450" y="100" width="250" height="350" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="460" y="125" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="14" font-weight="bold" fill="#92400e">srv-nas (Secondary LXD)</text>
  <text x="460" y="145" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="12" fill="#92400e">Ubuntu 22.04</text>
  
  <!-- Containers srv-nas -->
  <rect x="465" y="160" width="220" height="270" rx="5" fill="#fffbeb" stroke="#fbbf24" stroke-width="1"/>
  <text x="475" y="180" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="10" fill="#b45309">LXC: fileserver (NFS Homes)</text>
  <text x="475" y="195" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="10" fill="#b45309">LXC: git (Gitolite/Gitweb)</text>
  <text x="475" y="210" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="10" fill="#b45309">LXC: debmirror (Apt Mirror)</text>
  <text x="475" y="225" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="10" fill="#b45309">LXC: pxe (Deployment)</text>
  <text x="475" y="240" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="10" fill="#b45309">LXC: koha (Library)</text>
  <text x="475" y="255" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="10" fill="#b45309">LXC: log / storehouse</text>
  
  <!-- srv-gw -->
  <rect x="300" y="470" width="200" height="60" rx="8" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
  <text x="310" y="495" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="14" font-weight="bold" fill="#065f46">srv-gw (Gateway)</text>
  <text x="310" y="515" font-family="'Comic Sans MS', 'Comic Sans', sans-serif" font-size="10" fill="#065f46">Ubuntu 22.04 | Squid / E2Guardian</text>
  
  <!-- Connections -->
  <line x1="225" y1="450" x2="350" y2="470" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="575" y1="450" x2="450" y2="470" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrowhead)"/>
</svg>