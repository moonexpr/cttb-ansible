<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <!-- Background -->
  
  
  <!-- Title -->
  <text x="400" y="40" font-family="Inter Display, sans-serif" font-size="24" font-weight="bold" fill="#1e293b" text-anchor="middle">Sudhanix 26 Rollback Decision Tree</text>

  <!-- Issue Node -->
  <circle cx="400" cy="100" r="50" fill="#300820" stroke="#f472b6" stroke-width="2" />
  <text x="400" y="105" font-family="Inter Display, sans-serif" font-size="14" font-weight="bold" fill="#f472b6" text-anchor="middle">UPGRADE FAILED</text>

  <!-- Options -->
  <!-- Option 1: Rescue -->
  <rect x="50" y="200" width="220" height="150" rx="10" fill="#f1f5f9" stroke="#fbbf24" stroke-width="2" />
  <text x="160" y="230" font-family="Inter Display, sans-serif" font-size="16" font-weight="bold" fill="#fbbf24" text-anchor="middle">Minor Issue</text>
  <text x="160" y="260" font-family="Inter Display, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Boot Rescue USB/PXE</text>
  <text x="160" y="285" font-family="Inter Display, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Fix GRUB, Reset Passwd</text>
  <text x="160" y="315" font-family="Inter Display, sans-serif" font-size="12" fill="#34d399" text-anchor="middle">Canonical: [[PXERescue]]</text>

  <!-- Option 2: Re-install -->
  <rect x="300" y="250" width="200" height="120" rx="10" fill="#f1f5f9" stroke="#00b4d8" stroke-width="2" />
  <text x="400" y="280" font-family="Inter Display, sans-serif" font-size="16" font-weight="bold" fill="#00b4d8" text-anchor="middle">Structural Issue</text>
  <text x="400" y="310" font-family="Inter Display, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Fresh PXE Reinstall</text>
  <text x="400" y="335" font-family="Inter Display, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Fix user-data first!</text>

  <!-- Option 3: Legacy Revert -->
  <rect x="530" y="200" width="220" height="150" rx="10" fill="#f1f5f9" stroke="#ff4d6a" stroke-width="2" />
  <text x="640" y="230" font-family="Inter Display, sans-serif" font-size="16" font-weight="bold" fill="#ff4d6a" text-anchor="middle">Total Failure</text>
  <text x="640" y="260" font-family="Inter Display, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Revert to 20.04</text>
  <text x="640" y="285" font-family="Inter Display, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Use pre-deploy snapshot</text>
  <text x="640" y="315" font-family="Inter Display, sans-serif" font-size="12" fill="#fb923c" text-anchor="middle">Legacy Path: [[PXE]]</text>

  <!-- Arrows -->
  <path d="M 350 120 L 160 200" stroke="#f472b6" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <path d="M 400 150 L 400 250" stroke="#f472b6" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <path d="M 450 120 L 640 200" stroke="#f472b6" stroke-width="2" marker-end="url(#arrow)" fill="none" />

  <!-- Markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f472b6" />
    </marker>
  </defs>

</svg>
