<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  
  
  <!-- Title -->
  <text x="400" y="40" font-family="Inter Display, sans-serif" font-size="24" font-weight="bold" fill="#1e293b" text-anchor="middle">Sudhanix 26 Upgrade Lifecycle</text>

  <!-- Phases -->
  <!-- Phase 1: Provision -->
  <rect x="50" y="80" width="220" height="120" rx="10" fill="#f1f5f9" stroke="#00b4d8" stroke-width="2" />
  <text x="160" y="110" font-family="Inter Display, sans-serif" font-size="16" font-weight="bold" fill="#00b4d8" text-anchor="middle">1. Provision (PXE)</text>
  <text x="70" y="140" font-family="Inter Display, sans-serif" font-size="12" fill="#475569">Tool: efibootmgr / pxe-reboot.yml</text>
  <text x="70" y="160" font-family="Inter Display, sans-serif" font-size="12" fill="#475569">Action: Unattended Autoinstall</text>
  <text x="70" y="180" font-family="Inter Display, sans-serif" font-size="10" fill="#64748b">Wipes disk, installs base OS</text>

  <!-- Phase 2: Configure -->
  <rect x="300" y="80" width="220" height="120" rx="10" fill="#f1f5f9" stroke="#fb923c" stroke-width="2" />
  <text x="410" y="110" font-family="Inter Display, sans-serif" font-size="16" font-weight="bold" fill="#fb923c" text-anchor="middle">2. Configure (Ansible)</text>
  <text x="320" y="140" font-family="Inter Display, sans-serif" font-size="12" fill="#475569">Playbook: install-sudhanix-cslabs.yml</text>
  <text x="320" y="160" font-family="Inter Display, sans-serif" font-size="12" fill="#475569">Action: Full Desktop Config</text>
  <text x="320" y="180" font-family="Inter Display, sans-serif" font-size="10" fill="#64748b">LDAP, NFS, Themes, Apps, Print</text>

  <!-- Phase 3: Validate -->
  <rect x="550" y="80" width="220" height="120" rx="10" fill="#f1f5f9" stroke="#34d399" stroke-width="2" />
  <text x="660" y="110" font-family="Inter Display, sans-serif" font-size="16" font-weight="bold" fill="#34d399" text-anchor="middle">3. Validate (Manual)</text>
  <text x="570" y="140" font-family="Inter Display, sans-serif" font-size="12" fill="#475569">Checklist: Verification Checklist</text>
  <text x="570" y="160" font-family="Inter Display, sans-serif" font-size="12" fill="#475569">Action: Test LDAP, NFS, Print</text>
  <text x="570" y="180" font-family="Inter Display, sans-serif" font-size="10" fill="#64748b">Final sign-off for user</text>

  <!-- Flow Arrows -->
  <path d="M 270 140 L 300 140" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" fill="none" />
  <path d="M 520 140 L 550 140" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" fill="none" />

  <!-- Detail Box: The Ansible Role Handoff -->
  <rect x="150" y="250" width="500" height="200" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
  <text x="400" y="280" font-family="Inter Display, sans-serif" font-size="16" font-weight="bold" fill="#475569" text-anchor="middle">Step 2 Detail: Ansible Role Order</text>
  
  <text x="170" y="310" font-family="Inter Display, sans-serif" font-size="12" fill="#67e8f9">1. common</text>
  <text x="300" y="310" font-family="Inter Display, sans-serif" font-size="10" fill="#64748b">--- Base OS, SSH, apt, sudoers</text>
  
  <text x="170" y="335" font-family="Inter Display, sans-serif" font-size="12" fill="#67e8f9">2. time-server</text>
  <text x="300" y="335" font-family="Inter Display, sans-serif" font-size="10" fill="#64748b">--- systemd-timesyncd</text>
  
  <text x="170" y="360" font-family="Inter Display, sans-serif" font-size="12" fill="#67e8f9">3. sudhanix-core</text>
  <text x="300" y="360" font-family="Inter Display, sans-serif" font-size="10" fill="#64748b">--- Desktop, Themes, Browsers, Panel</text>
  
  <text x="170" y="385" font-family="Inter Display, sans-serif" font-size="12" fill="#67e8f9">4. ldap-client</text>
  <text x="300" y="385" font-family="Inter Display, sans-serif" font-size="10" fill="#64748b">--- nslcd, PAM auth, access control</text>

  <text x="170" y="410" font-family="Inter Display, sans-serif" font-size="12" fill="#67e8f9">5. nfs-home</text>
  <text x="300" y="410" font-family="Inter Display, sans-serif" font-size="10" fill="#64748b">--- autofs on-demand home mounts</text>

  <!-- Markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569" />
    </marker>
  </defs>

</svg>
